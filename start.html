<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Start here — EIT Studio</title>
<meta name="description" content="Prepare your target sentences, then administer an elicited imitation task or score the recordings you already have.">
<style>
  :root{
    --bg:#f2f2f4; --panel:#fff; --ink:#08080f; --muted:#6a6a7d; --line:#e8e8ef;
    --accent:#3840f3; --accent-dark:#2a31d4; --accent-soft:#eef0ff; --accent-line:#d9dcff;
    --pink:#ff1493; --pink-dark:#d1097a; --pink-soft:#fff0f8; --pink-line:#ffcfe8;
    --cy:#06b6d4; --cy-dark:#0891b2; --cy-ink:#0e7490; --cy-soft:#ecfeff; --cy-line:#a5f3fc;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); padding:66px 18px 60px;
    font:17.6px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,
      "Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    display:flex; justify-content:center; -webkit-font-smoothing:antialiased}
  .hd{position:fixed; top:0; left:0; right:0; z-index:20; height:50px;
    background:rgba(255,255,255,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); display:flex; align-items:center;
    justify-content:space-between; padding:0 22px}
  .hd .t{font-weight:800; font-size:18.2px; letter-spacing:-.3px}
  .hd .t a{text-decoration:none; color:inherit}
  .hd .t span{font-weight:400; color:var(--muted); font-size:13.3px; margin-left:9px;
    letter-spacing:.08em; text-transform:uppercase; font-family:var(--mono)}
  .tabs2{display:flex; gap:6px; margin-left:auto; margin-right:14px}
  .tabs2 a{font-size:15.2px; font-weight:600; text-decoration:none; color:var(--muted);
    padding:5px 12px; border-radius:8px; border:1px solid transparent; white-space:nowrap}
  .tabs2 a:hover{color:var(--ink); background:#f0f0f5}
  .tabs2 a.on{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent)}
  .hd .rt{display:flex; align-items:center; gap:12px}
  .lang button{font:inherit; font-size:15.2px; padding:4px 11px; border:1px solid var(--line);
    background:#fff; cursor:pointer}
  .lang button:first-child{border-radius:7px 0 0 7px}
  .lang button:last-child{border-radius:0 7px 7px 0; border-left:0}
  .lang button.on{background:var(--accent); color:#fff; border-color:var(--accent)}
  .stage{width:100%; max-width:1300px}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:14px;
    margin-bottom:18px; overflow:hidden}
  .pad{padding:32px 34px 34px}

  /* ---------- hero ---------- */
  .hero{display:flex; align-items:flex-end; gap:40px; flex-wrap:wrap;
    padding:14px 4px 30px}
  .hero .lt{flex:1 1 560px; min-width:0}
  .eyebrow{font-family:var(--mono); font-size:12.4px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--accent); margin:0 0 14px}
  .hero h1{margin:0; font-size:42px; line-height:1.14; letter-spacing:-1.5px; font-weight:800}
  .hero h1 em{font-style:normal; color:var(--accent)}
  .facts{flex:0 1 auto; min-width:0; display:grid; gap:10px; padding-bottom:6px}
  .facts div span{min-width:0}
  .facts div{display:flex; align-items:baseline; gap:10px; font-size:15.4px; color:var(--muted)}
  .facts b{font-family:var(--mono); font-size:13px; color:var(--accent-dark); flex:none;
    background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:7px;
    padding:2px 9px}

  /* ---------- closing band ---------- */
  .out{background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:26px 30px 24px; margin-bottom:18px;
    display:grid; grid-template-columns:minmax(0,1fr) auto; gap:28px; align-items:center}
  .out h2{margin:0 0 6px; font-size:19px; letter-spacing:-.4px; font-weight:750}
  .out p{margin:0; color:var(--muted); font-size:16.2px; line-height:1.62; max-width:70ch}
  .chips{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end}
  .chip{font-family:var(--mono); font-size:12.8px; color:var(--accent-dark);
    background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:999px;
    padding:6px 13px; white-space:nowrap}
  .chip.k{color:#8a4a6d; background:var(--pink-soft); border-color:var(--pink-line)}
  .chip.c{color:var(--cy-ink); background:var(--cy-soft); border-color:var(--cy-line)}

  /* ---------- step furniture ---------- */
  .sh{display:flex; align-items:baseline; gap:11px; margin:0 0 5px}
  .sh .num{width:25px; height:25px; border-radius:50%; background:var(--accent); color:#fff;
    font-size:14px; font-weight:800; display:inline-flex; align-items:center;
    justify-content:center; flex:none; transform:translateY(3px)}
  .sh h2{margin:0; font-size:21px; letter-spacing:-.45px; font-weight:750}
  .stepbody > p.d1{margin:0 0 12px; color:var(--muted); font-size:16.4px; line-height:1.66}

  /* ---------- the sheet ---------- */
  /* the sheet is sized by its contents: a full-width table stretched column B
     and left the sentences swimming in empty space */
  .xl{border:1px solid #cfcfda; border-radius:10px; overflow:hidden; display:inline-block;
    max-width:100%; box-shadow:0 2px 10px rgba(8,8,15,.05); background:#fff}
  .xl table{border-collapse:collapse; width:auto; font-size:16px}
  .xl th,.xl td{border-right:1px solid #e4e4ec; border-bottom:1px solid #e4e4ec;
    padding:6px 12px; text-align:left}
  .xl tr:last-child td,.xl tr:last-child th{border-bottom:0}
  .xl thead th{background:#f0f0f5; color:#8a8a9c; font-family:var(--mono); font-size:12.8px;
    font-weight:600; text-align:center; letter-spacing:.06em}
  .xl tbody th{background:#f0f0f5; color:#8a8a9c; font-family:var(--mono); font-size:12.8px;
    font-weight:600; text-align:center; width:34px}
  .xl td.a{font-family:var(--mono); width:54px; color:var(--muted)}
  .xl td.c{font-family:var(--mono); color:var(--muted); width:68px}

  .pick{margin:20px 0 0; font-size:15.6px; line-height:1.62; color:#3b3e73;
    background:var(--accent-soft); border:1px solid var(--accent-line);
    border-left:3px solid var(--accent); border-radius:4px 11px 11px 4px; padding:11px 16px}
  .pick b{color:var(--accent-dark); font-weight:750}

  /* ---------- the two routes, as on the landing page ---------- */
  .two-routes{display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:14px 0 4px}
  .route{border:1px solid var(--accent-line); border-radius:18px; padding:26px 28px 24px;
    background:var(--accent-soft); display:flex; flex-direction:column; position:relative}
  .route.pk{border-color:var(--pink-line); background:var(--pink-soft)}
  .route .rstep{position:absolute; top:-13px; left:28px; font-family:var(--mono); font-size:11px;
    letter-spacing:.14em; text-transform:uppercase; background:var(--accent); color:#fff;
    border-radius:999px; padding:5px 13px; font-weight:700}
  .route.pk .rstep{background:var(--pink)}
  .route h3{margin:12px 0 8px; font-size:24px; letter-spacing:-.75px; font-weight:800}
  .route p{margin:0 0 10px; font-size:17.2px; color:#40415e; flex:1 1 auto; line-height:1.68}
  .route.pk p{color:#6b2049}
  .menu{margin-top:2px}
  .menu a{display:flex; align-items:baseline; gap:9px; text-decoration:none;
    border-top:1px solid var(--accent-line); padding:8px 2px; transition:.15s}
  .menu a:last-child{border-bottom:1px solid var(--accent-line)}
  .menu a:hover{background:#f4f5ff}
  .menu b{font-size:15.7px; font-weight:700; color:var(--ink); letter-spacing:-.2px}
  .menu i{font-style:normal; font-size:14.1px; color:#4a4c86; flex:1 1 auto}
  .menu .ar{color:var(--accent); font-weight:700}
  .route.pk .menu a{border-color:var(--pink-line)}
  .route.pk .menu a:hover{background:#fff7fb}
  .route.pk .menu i{color:#8a4a6d}
  .route.pk .menu .ar{color:var(--pink)}

  /* ---------- the two steps sit side by side on a wide screen ---------- */
  /* the two columns end level: the route cards stretch to the taller column */
  .cols{display:grid; grid-template-columns:420px minmax(0,1fr); gap:34px; align-items:stretch}
  .cols > .rt2{display:flex; flex-direction:column}
  .cols > .rt2 > .two-routes{flex:1 1 auto}
  .cols > .rt2{position:relative}
  .cols > .rt2:before{content:""; position:absolute; left:-17px; top:4px; bottom:4px; width:1px;
    background:var(--line)}

  .foot{font-size:14px; color:var(--muted); padding:11px 22px; border-top:1px solid var(--line);
    background:#fafafb; font-family:var(--mono)}

  @media(max-width:1080px){
    .hero{gap:26px; padding-bottom:24px}
    .hero h1{font-size:34px; letter-spacing:-1.1px}
    .out{grid-template-columns:1fr; gap:16px}
    .chips{justify-content:flex-start}
    .cols{grid-template-columns:1fr; gap:0}
    .cols > .rt2:before{display:none}
    .cols > .rt2{border-top:1px solid var(--line); margin-top:30px; padding-top:26px}
  }
  @media(max-width:820px){ .two-routes{grid-template-columns:1fr; gap:26px} }
  @media(max-width:720px){
    .hero{padding:6px 2px 20px}
    .hero h1{font-size:28px; letter-spacing:-.8px}
    .out{padding:22px 20px 20px}
    .pad{padding:24px 20px 28px}
    .sh h2{font-size:19px}
    .route{padding:24px 22px 20px}
    .route h3{font-size:22px}
    .route p{font-size:16.4px}
    .xl table{font-size:15px}
    .xl th,.xl td{padding:7px 9px}
  }

  /* ---- narrow screens: the tool header becomes two rows -------------------
     Four tabs plus the language switch do not fit one 50 px row on a phone,
     and the overflow put the Segment tab and the switch out of reach. */
  @media(max-width:760px){
    body{padding-top:94px}
    .hd{height:auto; flex-wrap:wrap; padding:9px 14px 0; align-items:center}
    .hd .t{font-size:16.9px}
    .hd .t span{display:none}
    .hd .rt{margin-left:auto; gap:8px}
    .lang button{font-size:14px; padding:4px 9px}
    .tabs2{order:3; width:100%; margin:9px -14px 0; padding:0 14px 9px;
      gap:5px; overflow-x:auto; -webkit-overflow-scrolling:touch;
      scrollbar-width:none; -ms-overflow-style:none}
    .tabs2::-webkit-scrollbar{display:none}
    .tabs2 a{font-size:14.5px; padding:5px 10px; flex:0 0 auto}
  }
</style>
</head>
<body>

<div class="hd">
  <div class="t"><a href="index.html">EIT&nbsp;Studio</a><span data-i18n="hdSub"></span></div>
  <div class="tabs2">
    <a href="start.html" class="on" data-i18n="tabStart"></a>
    <a href="administer.html" data-i18n="tabAdm"></a>
    <a href="app.html" data-i18n="tabScore"></a>
    <a href="segment.html" data-i18n="tabSeg"></a>
  </div>
  <div class="rt">
    <span class="lang"><button id="langEn">English</button><button id="langKo">한국어</button></span>
  </div>
</div>

<div class="stage">
  <div class="hero">
    <div class="lt">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1><span data-i18n="h1a"></span> <em data-i18n="h1b"></em></h1>
    </div>
    <div class="facts">
      <div><b data-i18n="f1k"></b><span data-i18n="f1v"></span></div>
      <div><b data-i18n="f2k"></b><span data-i18n="f2v"></span></div>
      <div><b data-i18n="f3k"></b><span data-i18n="f3v"></span></div>
    </div>
  </div>

  <div class="panel"><div class="pad">
    <div class="cols">

      <div>
        <div class="sh"><span class="num">1</span><h2 data-i18n="s1t"></h2></div>
        <div class="stepbody">
          <p class="d1" data-i18n="s1d"></p>
          <div class="xl">
            <table>
              <thead><tr><th></th><th>A</th><th>B</th><th>C</th></tr></thead>
              <tbody>
                <tr><th>1</th><td class="a">1</td><td>I have to get a haircut.</td><td class="c">7</td></tr>
                <tr><th>2</th><td class="a">2</td><td>The red book is on the table.</td><td class="c">8</td></tr>
                <tr><th>3</th><td class="a">3</td><td>The streets in this city are wide.</td><td class="c">8</td></tr>
              </tbody>
            </table>
          </div>
          <p class="pick"><b data-i18n="pickB"></b> <span data-i18n="pickS"></span></p>
        </div>
      </div>

      <div class="rt2">
        <div class="sh"><span class="num">2</span><h2 data-i18n="s2t"></h2></div>
        <div class="two-routes">
          <div class="route">
            <span class="rstep" data-i18n="capAdm"></span>
            <h3 data-i18n="admT"></h3>
            <p data-i18n="admD"></p>
            <div class="menu">
              <a href="administer.html"><b data-i18n="admGo"></b><i></i><span class="ar">→</span></a>
            </div>
          </div>
          <div class="route pk">
            <span class="rstep" data-i18n="capSc"></span>
            <h3 data-i18n="scT"></h3>
            <p data-i18n="scD"></p>
            <div class="menu">
              <a href="app.html"><b data-i18n="sc1"></b><i data-i18n="sc1s"></i><span class="ar">→</span></a>
              <a href="segment.html"><b data-i18n="sc2"></b><i data-i18n="sc2s"></i><span class="ar">→</span></a>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div></div>

  <div class="out">
    <div>
      <h2 data-i18n="outT"></h2>
      <p data-i18n="outD"></p>
    </div>
    <div class="chips"><span class="chip" data-i18n="chip1"></span>
      <span class="chip k" data-i18n="chip2"></span>
      <span class="chip c" data-i18n="chip3"></span></div>
  </div>

  <div class="panel"><div class="foot" id="foot"></div></div>
</div>

<script>
const $=id=>document.getElementById(id);

const I18N={
en:{
 hdSub:"English EIT · for researchers",
 eyebrow:"Start here",
 h1a:"Administer an elicited imitation task, and score it,",
 h1b:"in the browser.",
 f1k:"2 steps", f1v:"prepare the sentences, then administer or score",
 f2k:"5–10 min", f2v:"to transcribe and score 30 items, on a recent laptop",
 f3k:"0 uploads", f3v:"no server, no account, nothing leaves the machine",
 outT:"What you end up with",
 outD:"Word error rate for every item and every participant, with the transcription beside each target, exported as CSV and JSON.",
 chip1:"no upload", chip2:"no account", chip3:"CSV + JSON",
 s1t:"Prepare your target sentences",
 s1d:"Three columns, one item per row: number, sentence, syllable count. Upload the sheet saved as CSV, or paste the rows straight into the page.",
 pickB:"Or use a ready-made set:",
 pickS:"the English EIT of Ortega et al. (2002), available for both administration and scoring.",
 s2t:"Administer, or score what you have",
 capAdm:"Administer",
 admT:"Administer your EIT",
 admD:"Add the stimulus recordings: the task runs in the browser on a fixed schedule and each response is saved as its own audio file.",
 admGo:"Set up a session",
 capSc:"Score",
 scT:"Score what you collected",
 scD:"Whisper large-v3-turbo transcribes your response audio in the browser and word error rate is computed against the targets.",
 sc1:"One file per item", sc1s:"score now",
 sc2:"One long recording", sc2s:"split first",
 foot:"Everything runs locally in your browser · no upload, no account"
},
ko:{
 hdSub:"English EIT · 연구자용",
 eyebrow:"시작하기",
 h1a:"Elicited imitation 과제를 시행하고 채점합니다,",
 h1b:"브라우저 안에서.",
 f1k:"2단계", f1v:"문장을 준비한 뒤, 시행하거나 채점합니다",
 f2k:"5~10분", f2v:"최신 노트북에서 30문항을 전사·채점하는 데 걸리는 시간",
 f3k:"업로드 0", f3v:"서버도 계정도 없고, 어떤 파일도 컴퓨터를 떠나지 않습니다",
 outT:"무엇이 남는가",
 outD:"문항별·참가자별 단어 오류율과 각 목표 문장 옆의 전사 결과가 CSV와 JSON으로 내보내집니다.",
 chip1:"업로드 없음", chip2:"계정 없음", chip3:"CSV + JSON",
 s1t:"목표 문장을 준비하십시오",
 s1d:"세 개의 열에 한 행씩 한 문항을 적습니다. 번호, 문장, 음절 수 순서이며, CSV로 저장한 파일을 올리시거나 행을 그대로 붙여넣으시면 됩니다.",
 pickB:"이미 만들어진 세트도 있습니다.",
 pickS:"Ortega et al. (2002)의 영어 EIT를 시행과 채점 양쪽에서 불러올 수 있습니다.",
 s2t:"시행하거나, 가지고 계신 녹음을 채점하십시오",
 capAdm:"시행",
 admT:"EIT 시행하기",
 admD:"자극 녹음을 추가하십시오. 과제가 브라우저에서 정해진 일정대로 진행되고, 각 응답이 개별 음성 파일로 저장됩니다.",
 admGo:"세션 설정하기",
 capSc:"채점",
 scT:"수집한 자료 채점하기",
 scD:"Whisper large-v3-turbo가 브라우저에서 응답 음성을 전사하고, 목표 문장과 대조해 단어 오류율을 계산합니다.",
 sc1:"문항당 파일 하나", sc1s:"바로 채점",
 sc2:"긴 녹음 하나", sc2s:"먼저 나누기",
 foot:"모든 처리는 브라우저 안에서 이루어집니다 · 업로드 없음, 계정 없음"
}
};

I18N.en.tabStart="Start"; I18N.en.tabAdm="Administer"; I18N.en.tabScore="Score"; I18N.en.tabSeg="Segment";
I18N.ko.tabStart="시작"; I18N.ko.tabAdm="시행"; I18N.ko.tabScore="채점"; I18N.ko.tabSeg="분절";

let LANG=(()=>{ try{ return localStorage.getItem("eitLang")||"en"; }catch(e){ return "en"; } })();
const T=k=>(I18N[LANG]&&I18N[LANG][k])!=null?I18N[LANG][k]:(I18N.en[k]||"");
function applyLang(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const v=T(el.getAttribute("data-i18n"));
    if(typeof v==="string") el.textContent=v;
  });
  document.documentElement.lang=LANG;
  $("langEn").classList.toggle("on",LANG==="en");
  $("langKo").classList.toggle("on",LANG==="ko");
  $("foot").textContent=T("foot");
}
function setLang(l){ LANG=l; try{ localStorage.setItem("eitLang",l); }catch(e){} applyLang(); }
$("langEn").onclick=()=>setLang("en");
$("langKo").onclick=()=>setLang("ko");
applyLang();
</script>
</body>
</html>
