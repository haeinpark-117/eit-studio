<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Administer — EIT Studio</title>
<meta name="description" content="Administer an elicited imitation task in the browser on the schedule of Ortega et al. (2002), with each response saved as its own audio file.">
<style>
  :root{
    --bg:#f2f2f4; --panel:#fff; --ink:#08080f; --muted:#6a6a7d; --line:#e8e8ef; --soft:#f5f5f9;
    --accent:#3840f3; --accent-dark:#2a31d4; --accent-soft:#eef0ff; --accent-line:#d9dcff;
    --pink:#ff1493; --pink-dark:#d1097a; --pink-soft:#fff0f8; --pink-line:#ffcfe8;
    --cy:#06b6d4; --cy-ink:#0e7490; --cy-soft:#ecfeff; --cy-line:#a5f3fc;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); padding:66px 18px 60px;
    font:17.6px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    display:flex; justify-content:center; -webkit-font-smoothing:antialiased}
  body.running{padding:66px 18px 40px}
  a{color:var(--accent)}
  .hd{position:fixed; top:0; left:0; right:0; z-index:20; height:50px;
    background:rgba(255,255,255,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); display:flex; align-items:center;
    justify-content:flex-start; gap:14px; padding:0 22px}
  .hd .t{font-weight:800; font-size:18.2px; letter-spacing:-.3px}
  .hd .t a{text-decoration:none; color:inherit}
  .hd .t span{font-weight:400; color:var(--muted); font-size:13.3px; margin-left:9px;
    letter-spacing:.08em; text-transform:uppercase; font-family:var(--mono)}
  .tabs2{display:flex; gap:6px}
  .tabs2 a{font-size:15.2px; font-weight:600; text-decoration:none; color:var(--muted);
    padding:5px 12px; border-radius:8px; border:1px solid transparent; white-space:nowrap}
  .tabs2 a:hover{color:var(--ink); background:#f0f0f5}
  .tabs2 a.on{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent)}
  .hd .rt{display:flex; align-items:center; gap:12px}
  .lang button{font:inherit; font-size:15.2px; padding:4px 11px; border:1px solid var(--line);
    background:#fff; cursor:pointer}
  .lang button:first-child{border-radius:7px 0 0 7px}
  .lang button:last-child{border-radius:0 7px 7px 0; border-left:0}
  .lang button.on{background:var(--accent); color:#fff; border-color:var(--accent)}
  .stage{width:100%; max-width:1120px}

  /* ---- page hero ---------------------------------------------------------
     The name of the tool and a one-line description of it, matching the
     scoring and segmentation pages. */
  .hero{padding:22px 4px 18px; display:flex; align-items:center; gap:14px;
    flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:20px}
  .hero-t{margin:0; font-size:23px; line-height:1.2; font-weight:800;
    letter-spacing:-.5px; color:var(--accent); white-space:nowrap}
  .hero-s{margin:0; flex:1 1 340px; font-size:15.2px; line-height:1.6; color:var(--muted)}
  .hero-back{font-size:15.2px; color:var(--accent); text-decoration:none; font-weight:600;
    white-space:nowrap}
  .hero-back:hover{text-decoration:underline}
  @media(max-width:640px){ .hero{padding:16px 4px 14px} }

  /* ---- one step at a time ------------------------------------------------
     Five panels open at once is more than a researcher needs to see. Only one
     is open; every step stays on the page as a title row and can be opened at
     any time, so nothing is hidden and nothing is locked. */
  .panel.fold .pad > *:not(.ph){display:none}
  .panel.fold .pad{padding:15px 24px}
  .panel.fold .ph{margin-bottom:0}
  .panel.fold:hover{border-color:#d4d4dc}
  .ph{cursor:default}
  .panel.fold .ph{cursor:pointer}
  .ph .sum{margin-left:auto; font-family:var(--mono); font-size:13.2px; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:46ch}
  .panel.fold .ph .sum ~ .st{margin-left:15px}
  .panel:not(.fold) .ph .sum{display:none}
  .chevp{flex:none; color:#b9b9c6; font-size:18px; line-height:1; margin-left:14px;
    transition:transform .15s}
  .panel:not(.fold) .chevp{transform:rotate(90deg); color:var(--accent)}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:14px;
    margin-bottom:14px; overflow:hidden}
  .pad{padding:22px 24px 24px}
  .ph{display:flex; align-items:center; gap:11px; margin:0 0 4px}
  .ph .n{width:23px; height:23px; border-radius:7px; background:var(--accent-soft);
    color:var(--accent); display:grid; place-items:center; font-family:var(--mono);
    font-size:14px; font-weight:700; flex:none}
  .ph h3{margin:0; font-size:19.4px; letter-spacing:-.3px}
  .ph .st{margin-left:auto; font-family:var(--mono); font-size:12.8px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--cy-ink); background:var(--cy-soft);
    border:1px solid var(--cy-line); border-radius:999px; padding:4px 10px; white-space:nowrap}
  .ph .st.wait{color:var(--muted); background:var(--soft); border-color:var(--line)}
  .ph .st.bad{color:#b91c1c; background:#fef2f2; border-color:#fecaca}
  .hint{margin:0 0 15px; color:var(--muted); font-size:16px; line-height:1.65; padding-left:34px}
  .row{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin:0 0 10px; padding-left:34px}
  .fl{font-size:15.7px; color:var(--muted)}
  input.inp,select.inp{font:inherit; border:1px solid var(--line); border-radius:8px;
    padding:7px 10px; font-size:15.7px; background:#fff; color:var(--ink); min-width:120px}
  input.inp.sm{min-width:74px; width:74px; font-family:var(--mono); font-size:15.2px}
  .btn-g{font:inherit; border:1px solid var(--line); background:#fff; border-radius:9px;
    padding:7px 13px; font-size:15.2px; font-weight:600; color:var(--ink); cursor:pointer}
  .btn-g:hover:not(:disabled){border-color:#c9c9d4; background:#fafafb}
  .btn-g:disabled{opacity:.45; cursor:default}
  .btn-p{font:inherit; background:var(--accent); color:#fff; border:0; border-radius:10px;
    padding:11px 20px; font-size:16.9px; font-weight:650; cursor:pointer}
  .btn-p:hover:not(:disabled){background:var(--accent-dark)}
  .btn-p:disabled{opacity:.4; cursor:default}
  .btn-k{font:inherit; background:var(--pink); color:#fff; border:0; border-radius:10px;
    padding:11px 20px; font-size:16.9px; font-weight:650; cursor:pointer}
  .btn-k:hover{background:var(--pink-dark)}
  .mono{font-family:var(--mono); font-size:14px; color:var(--muted); line-height:1.85;
    word-break:break-all}
  .box{margin:0 0 4px 34px; background:#f7f7fa; border:1px solid var(--line); border-radius:9px;
    padding:10px 12px}
  .box .d{margin:9px 0 0; font-size:15.3px; color:var(--muted); line-height:1.68}
  table.pw{border-collapse:collapse; font-family:var(--mono); font-size:14px; margin:10px 0 0}
  table.pw td{padding:5px 16px 5px 0; color:var(--muted); white-space:nowrap}
  table.pw td:first-child{color:var(--ink)}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-left:34px}
  .sub{border:1px solid var(--line); border-radius:11px; padding:14px 16px 15px; background:#fafafb}
  .sub .k{font-size:16.4px; font-weight:700; letter-spacing:-.2px; margin:0 0 3px}
  .sub .d{margin:0 0 11px; font-size:16px; color:var(--muted); line-height:1.6}
  .sub .ln{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 10px}
  .sub .ln:last-child{margin-bottom:0}
  .zone{border:1px dashed #c8c8d4; border-radius:9px; background:#fff; padding:13px 12px;
    text-align:center; font-size:14.9px; color:var(--muted); cursor:pointer}
  .zone.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-dark)}
  .fmt{display:flex; font-family:var(--mono); font-size:13.3px; background:#fff;
    border:1px solid var(--line); border-radius:8px; overflow:hidden}
  .fmt s{text-decoration:none; padding:8px 9px; color:var(--ink); white-space:nowrap}
  .fmt s+s{border-left:1px solid var(--line)}
  .fmt s i{display:block; font-style:normal; font-size:10.9px; letter-spacing:.09em;
    text-transform:uppercase; color:var(--muted); margin-top:3px}
  textarea{width:100%; height:120px; font:15.2px/1.5 var(--mono); padding:9px 11px;
    border:1px solid var(--line); border-radius:9px; resize:vertical}
  .tally{margin:14px 0 0 34px; font-family:var(--mono); font-size:14px; color:var(--cy-ink);
    background:var(--cy-soft); border:1px solid var(--cy-line); border-radius:8px;
    padding:8px 12px; display:inline-block}
  .tally.bad{color:#b91c1c; background:#fef2f2; border-color:#fecaca}
  .src{margin:16px 0 0 34px; font-size:14px; color:#a0a0ae; line-height:1.7}
  .meter{height:9px; border-radius:6px; background:var(--soft); border:1px solid var(--line);
    overflow:hidden; width:100%}
  .meter i{display:block; height:100%; background:var(--cy); width:0%; transition:width .08s}
  .foot{padding:16px 24px; border-top:1px solid var(--line); background:#fafafb;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .foot .m{font-size:15.2px; color:var(--muted)}

  .gpanel{background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:14px;
    margin-bottom:14px; overflow:hidden}
  .gpanel .pad{padding:18px 22px 20px}
  details.g summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px;
    flex-wrap:wrap}
  details.g summary::-webkit-details-marker{display:none}
  .chev{color:var(--accent); font-size:23px; line-height:1; transition:transform .15s;
    display:inline-block; font-weight:700}
  details.g[open] .chev{transform:rotate(90deg)}
  .badge-read{font-family:var(--mono); font-size:12.1px; letter-spacing:.12em; text-transform:uppercase;
    background:var(--accent); color:#fff; border-radius:999px; padding:4px 10px; font-weight:700;
    white-space:nowrap}
  .gtitle{font-size:18.8px; font-weight:700; letter-spacing:-.2px; color:var(--ink)}
  details.g summary:hover .gtitle{color:var(--accent-dark)}
  .glist{margin:14px 0 0; padding:14px 0 0; list-style:none;
    border-top:1px solid var(--accent-line)}
  .glist li{position:relative; padding:0 0 0 22px; margin-bottom:11px; font-size:16.1px;
    line-height:1.65; color:var(--muted)}
  .glist li:last-child{margin-bottom:0}
  .glist li:before{content:""; position:absolute; left:6px; top:8px; width:5px; height:5px;
    border-radius:50%; background:var(--accent-line)}
  .glist li b{color:var(--ink); font-weight:650}

  .pscreen{background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden;
    margin-bottom:14px}
  .pbar{display:flex; align-items:center; gap:12px; padding:13px 22px;
    border-bottom:1px solid var(--line); background:#fafafb}
  .pbar .cnt{font-family:var(--mono); font-size:13.3px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted)}
  .dots{display:flex; gap:4px; margin-left:auto; flex-wrap:wrap; max-width:430px}
  .dots s{width:7px; height:7px; border-radius:50%; background:#e3e3ea; text-decoration:none}
  .dots s.done{background:var(--accent-line)}
  .dots s.now{background:var(--pink)}
  .endx{font-size:14px; color:var(--muted); border:1px solid var(--line); border-radius:8px;
    padding:5px 11px; background:#fff; cursor:pointer; font:inherit; font-size:14px;
    margin-left:14px; white-space:nowrap}
  .endx:hover{border-color:#e5b4b4; color:#b91c1c}
  .pbody{padding:52px 34px 46px; text-align:center}
  .pbody.tint{background:var(--pink-soft)}
  .pbody.tint2{background:var(--accent-soft)}
  .plabel{display:inline-flex; align-items:center; gap:8px; font-family:var(--mono);
    font-size:12.8px; letter-spacing:.14em; text-transform:uppercase; border-radius:999px;
    padding:6px 14px; background:#fff; border:1px solid var(--accent-line);
    color:var(--accent-dark); font-weight:700}
  .pbody.tint .plabel{border-color:var(--pink-line); color:var(--pink-dark)}
  .pbody h3{margin:20px 0 8px; font-size:34px; font-weight:800; letter-spacing:-1.1px;
    line-height:1.16}
  .pbody p.s{margin:0 auto; color:var(--muted); font-size:18.2px; max-width:46ch; line-height:1.65}
  .pbar2{height:8px; border-radius:5px; background:#fff; border:1px solid var(--pink-line);
    margin:30px auto 9px; max-width:420px; overflow:hidden}
  .pbar2 i{display:block; height:100%; background:var(--pink); width:0%}
  .psecs{font-family:var(--mono); font-size:14.5px; color:var(--muted); margin:0}
  .pwave{display:flex; align-items:flex-end; justify-content:center; gap:4px; height:34px;
    margin:30px 0 0}
  .pwave s{width:4px; border-radius:3px; background:var(--accent-line); text-decoration:none;
    height:20%}
  .pfoot{padding:14px 22px; border-top:1px solid var(--line); background:#fafafb;
    font-size:15.2px; color:var(--muted)}
  .done-h{text-align:center; padding:8px 0 4px}
  .done-h .ic{width:46px; height:46px; border-radius:14px; background:var(--cy-soft);
    border:1px solid var(--cy-line); color:var(--cy-ink); display:grid; place-items:center;
    font-size:22px; margin:0 auto 14px}
  .done-h h3{margin:0 0 6px; font-size:23px; letter-spacing:-.6px}
  .done-h p{margin:0 auto 20px; color:var(--muted); font-size:16.9px; max-width:54ch}
  /* The download is the one action that must happen, so it takes a row of its
     own; what follows it is a choice, not a next step. */
  .act{display:flex; align-items:center; gap:12px; border:1px solid var(--line);
    background:#fff; padding:14px 18px; cursor:pointer; text-align:left; font:inherit; width:100%}
  .act .num{width:22px; height:22px; border-radius:50%; display:grid; place-items:center;
    font-family:var(--mono); font-size:13px; font-weight:700; background:#fff; color:var(--muted);
    border:1px solid var(--line); flex:none}
  .act .lbl{line-height:1.35}
  .act .lbl b{display:block; font-size:16.8px; font-weight:700; letter-spacing:-.2px}
  .act .lbl i{font-style:normal; font-size:13.9px; color:var(--muted)}
  .act:hover:not(:disabled){border-color:#c9c9d4}
  .act:disabled{opacity:.5; cursor:default}
  .first{border-radius:13px; background:var(--accent-soft); border-color:var(--accent-line);
    justify-content:center; padding:16px 20px}
  .first:hover{border-color:var(--accent)}
  .first .num{background:var(--accent); color:#fff; border-color:var(--accent)}
  .first .lbl i{color:var(--accent-dark); font-weight:650}
  .ruleline{display:flex; align-items:center; gap:14px; margin:20px 0 14px;
    color:var(--muted); font-size:13.6px}
  .ruleline:before,.ruleline:after{content:""; flex:1; height:1px; background:var(--line)}
  .pair{display:grid; grid-template-columns:1fr 1fr; gap:0}
  .pair .act:first-child{border-radius:12px 0 0 12px; border-right:0}
  .pair .act:last-child{border-radius:0 12px 12px 0}
  @media(max-width:620px){
    .pair{grid-template-columns:1fr}
    .pair .act:first-child{border-radius:12px 12px 0 0; border-right:1px solid var(--line);
      border-bottom:0}
    .pair .act:last-child{border-radius:0 0 12px 12px}
  }
  table.f{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:14px}
  table.f td{border-bottom:1px solid var(--line); padding:7px 4px; color:var(--muted)}
  table.f tr:last-child td{border-bottom:0}
  table.f td:last-child{text-align:right}
  .hidden{display:none !important}
  .err{color:#b91c1c; font-size:15.5px; line-height:1.6; display:block; max-width:52ch}
  .ok{color:var(--muted); font-size:15.5px; line-height:1.6; display:block; max-width:52ch}
  @media(max-width:720px){
    .two{grid-template-columns:1fr}
    .pbody h3{font-size:26px}
    .tabs2 a{padding:5px 8px; font-size:14px}
  }

  /* ---- links out to the documentation ---------------------------------------
     The tool pages used to link only to one another, so a question that came up
     mid-run ("what does the normalizer do", "how do I cite this") had no exit. */
  .hsep{width:1px; height:22px; background:var(--line); margin-left:auto; flex:none}
  .docs2{display:flex; gap:19px; font-size:14.6px; white-space:nowrap}
  .docs2 a{text-decoration:none; color:var(--muted)}
  .docs2 a:hover{color:var(--ink)}

  /* ---- narrow screens: the tool header becomes two rows -------------------
     Four tabs plus the language switch do not fit one 50 px row on a phone,
     and the overflow put the Segment tab and the switch out of reach. */
  @media(max-width:760px){
    body,body.running{padding-top:175px}
    .hd{height:auto; flex-wrap:wrap; padding:9px 14px 0; align-items:center}
    .hd .t{font-size:16.9px}
    .hd .t span{display:none}
    .hd .rt{margin-left:auto; gap:8px}
    .lang button{font-size:14px; padding:4px 9px}
    .tabs2{order:3; width:100%; margin:9px -14px 0; padding:0 14px 9px;
      gap:5px; overflow-x:auto; -webkit-overflow-scrolling:touch;
      scrollbar-width:none; -ms-overflow-style:none}
    .tabs2::-webkit-scrollbar{display:none}
    .tabs2 a{font-size:14.5px; padding:5px 10px; flex:0 0 auto}
    /* the 34 px indent that aligns with the panel numerals costs more than it
       is worth once the column is this narrow */
    .hint,.row{padding-left:0}
    .box,.two,.tally,.src{margin-left:0}
    .two>*{min-width:0}
    .pad{padding:22px 18px 24px}
    table.pw{width:100%}
    table.pw td{white-space:normal; padding-right:8px}
    table.pw td:last-child{text-align:right}
  }
  /* on a narrow screen the documentation links drop to their own row, so the
     body has to clear a taller fixed header */
  @media(max-width:1100px){
    .hsep{display:none}
    .docs2{order:4; width:100%; margin:0 -14px; padding:8px 14px 9px;
      border-top:1px solid var(--line); gap:16px; font-size:14px;
      overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none}
    .docs2::-webkit-scrollbar{display:none}
    .hd{height:auto; flex-wrap:wrap; padding:9px 14px 0; align-items:center}
  }
  @media(max-width:1100px) and (min-width:761px){ body,body.running{padding-top:117px} }
  @media(max-width:760px){ body,body.running{padding-top:175px} }
</style>
</head>
<body>

<div class="hd">
  <div class="t"><a href="index.html">EIT&nbsp;Studio</a></div>
  <div class="tabs2">
    <a href="start.html" data-i18n="tabStart"></a>
    <a href="administer.html" class="on" data-i18n="tabAdm"></a>
    <a href="app.html" data-i18n="tabScore"></a>
    <a href="segment.html" data-i18n="tabSeg"></a>
  </div>
  <span class="hsep"></span>
  <div class="docs2">
    <a href="how.html">How it works</a>
    <a href="asr.html">Speech recognition</a>
    <a href="cite.html">How to cite</a>
    <a href="about.html">About</a>
  </div>
</div>

<div class="stage">

<!-- ================= SETUP ================= -->
<div id="setup">

  <div class="hero">
    <h1 class="hero-t" data-i18n="heroT"></h1>
    <p class="hero-s" data-i18n="heroSub"></p>
    <a class="hero-back" href="index.html" data-i18n="heroBack"></a>
  </div>

  <div class="panel hidden" id="recover" style="border-color:var(--pink-line);
       background:var(--pink-soft)"><div class="pad" style="padding:18px 22px 20px">
    <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap">
      <div style="flex:1 1 320px">
        <div style="font-weight:700; font-size:18.2px; letter-spacing:-.25px"
             data-i18n="recTitle"></div>
        <div id="recN" style="margin:4px 0 0; font-size:15.7px; color:var(--muted)"></div>
      </div>
      <button class="btn-p" id="recGo" data-i18n="recGo"></button>
      <button class="btn-g" id="recDrop" data-i18n="recDrop"></button>
    </div>
  </div></div>

  <div class="gpanel"><div class="pad"><details class="g">
    <summary><span class="chev">›</span><span class="badge-read" data-i18n="gBadge"></span>
      <span class="gtitle" data-i18n="gTitle"></span></summary>
    <ul class="glist">
      <li><b data-i18n="g1b"></b> <span data-i18n="g1"></span></li>
      <li><b data-i18n="g2b"></b> <span data-i18n="g2"></span></li>
      <li><b data-i18n="g3b"></b> <span data-i18n="g3"></span></li>
    </ul>
  </details></div></div>

  <div class="panel"><div class="pad">
    <div class="ph"><span class="n">1</span><h3 data-i18n="p1t"></h3>
      <span class="sum" id="sum1"></span><span class="st wait" id="st1" data-i18n="stNeed"></span><span class="chevp">›</span></div>
    <p class="hint" data-i18n="p1h"></p>

const LANG="en";
const T=k=>STR[LANG][k];
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const v=STR[LANG][el.dataset.i18n];

/* ------------------------------------------------------------ sentence set */
let STIM=[];      /* [{name, dur, buf|null, src:File|url}] */
let TGT=[];       /* [[n, text, syl]] */

function csvSplit(line){
  const out=[]; let cur="", q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(q){
      if(c==='"' && line[i+1]==='"'){ cur+='"'; i++; }
      else if(c==='"') q=false;
      else cur+=c;
    }else{
      if(c==='"') q=true;
      else if(c===","){ out.push(cur.trim()); cur=""; }
      else cur+=c;
    }
  }
  out.push(cur.trim());
  return out;
}
function parseTargets(text){
  const out=[]; let auto=0;
  String(text||"").split(/\r?\n/).forEach(line=>{
    const raw=line.trim(); if(!raw) return;
    /* A sheet saved as CSV quotes any sentence that contains a comma, so the
       line has to be split with the quoting rules rather than on every comma. */
    const cells=raw.indexOf("\t")>=0?raw.split("\t").map(c=>c.trim()):csvSplit(raw);
    if(cells.length>=2&&/^(item|number|no|num|sentence|번호)$/i.test(cells[0])) return;   /* header */
    if(cells.length>=3&&/^\d+$/.test(cells[0])&&/^\d+$/.test(cells[cells.length-1]))
      out.push([parseInt(cells[0],10),cells.slice(1,-1).join(","),parseInt(cells[cells.length-1],10)]);
    else if(cells.length>=2&&/^\d+$/.test(cells[cells.length-1])&&!/^\d+$/.test(cells[0]))
      out.push([++auto,cells.slice(0,-1).join(","),parseInt(cells[cells.length-1],10)]);
  });
  return out;
}
function readTargets(){ TGT=parseTargets($("tgtBox").value); paintTally(); paintSchedule(); paintStart(); }
$("tgtBox").addEventListener("input",readTargets);
$("tgtFileBtn").onclick=()=>$("tgtFile").click();
$("tgtFile").onchange=async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value="";
  if(!f) return;
  $("tgtBox").value=await f.text(); readTargets(); foldAdvance();
};

/* stimulus intake ---------------------------------------------------------- */
const zone=$("zone");
zone.onclick=()=>$("stimIn").click();
zone.ondragover=e=>{e.preventDefault(); zone.classList.add("on");};
zone.ondragleave=()=>zone.classList.remove("on");
zone.ondrop=e=>{e.preventDefault(); zone.classList.remove("on"); takeStim(e.dataTransfer.files);};
$("stimIn").onchange=e=>takeStim(e.target.files);

async function takeStim(list){
  const fs=[...list].filter(f=>/\.(wav|mp3|m4a|webm|ogg|flac|aac)$/i.test(f.name))
                    .sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  STIM=fs.map(f=>({name:f.name,src:f,buf:null,dur:null}));
  await measure();
}
$("loadEitA").onclick=async()=>{
  STIM=EITA_FILES.map(u=>({name:u.split("/").pop(),src:u,buf:null,dur:null}));
  $("tgtBox").value=PRESET_EITA.map(r=>r[0]+"\t"+r[1]+"\t"+r[2]).join("\n");
  readTargets(); await measure(); foldAdvance();
};
$("clearAll").onclick=()=>{ STIM=[]; $("tgtBox").value=""; readTargets(); paintStimList(); paintTally(); paintStart(); };

/* Durations are read from the files themselves: the articulation-time term of
   the response window must reflect the recording actually used, so that
   re-recorded stimuli need no further adjustment. */
async function measure(){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  let done=0;
  for(const s of STIM){
    try{
      const ab=s.src instanceof File ? await s.src.arrayBuffer()
                                     : await (await fetch(s.src)).arrayBuffer();
      s.buf=await ctx.decodeAudioData(ab);
      s.dur=s.buf.duration;
    }catch(e){ s.dur=null; s.err=String(e&&e.message||e); }
    done++; $("stimList").textContent=done+" / "+STIM.length;
  }
  ctx.close();
  paintStimList(); paintTally(); paintSchedule(); paintStart();
}
function paintStimList(busy){
  const el=$("stimList");
  if(busy){ el.textContent="…"; return; }
  if(!STIM.length){ el.textContent=""; return; }
  const names=STIM.map(s=>s.name);
  el.textContent=names.slice(0,3).join("  ")+(names.length>3?"  … "+names.length:"");
}
function paintTally(){
  const t=$("tally"); const a=STIM.length, b=TGT.length;
  if(!a&&!b){ t.classList.add("hidden"); }
  else if(a&&b&&a===b){
    const ys=TGT.map(r=>r[2]).filter(Boolean);
    t.className="tally"; t.textContent=T("fmtTally")(a,b,Math.min(...ys),Math.max(...ys));
  } else { t.className="tally bad"; t.textContent=T("fmtTallyBad")(a,b); }
  $("st2").textContent=(a&&b&&a===b)?T("stOk"):T("stNeed");
  $("st2").className="st"+((a&&b&&a===b)?"":" wait");
  $("st1").textContent=$("pid").value.trim()?T("stSet"):T("stNeed");
  $("st1").className="st"+($("pid").value.trim()?"":" wait");
}
$("pid").addEventListener("input",()=>{paintTally(); paintStart();});

let PRAC=[];
async function loadPractice(){
  const k=$("pracLang").value;
  PRAC=[];
  if(k!=="off"){
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    for(const p of PRACTICE[k]){
      try{
        const ab=await (await fetch(p.f)).arrayBuffer();
        const buf=await ctx.decodeAudioData(ab.slice(0));

      }catch(e){}
    }
    ctx.close();
  }
  paintPractice();
}

                         base:num("cBase"),per:num("cPer"),thr:num("cThr")};}
function windowFor(dur,syl){

}

/* ---------------------------------------------------------- audio capture */
let CTX=null, STREAM=null, PROC=null, ANALYSER=null, ARM=null, CHUNKS=[], SR=48000;
const CAP_GRACE=0.14;            /* held open one buffer past the window, so a late
                                    callback still arrives while ARM is set */
let MIC_OK=false, STORE_OK=false;

async function initAudio(deviceId){
  if(STREAM) STREAM.getTracks().forEach(t=>t.stop());
  if(CTX && CTX.state!=="closed") await CTX.close();
  CTX=new (window.AudioContext||window.webkitAudioContext)();
  SR=CTX.sampleRate;
  STREAM=await navigator.mediaDevices.getUserMedia({audio:deviceId?
      {deviceId:{exact:deviceId},echoCancellation:false,noiseSuppression:false,autoGainControl:false}:
      {echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const src=CTX.createMediaStreamSource(STREAM);
  ANALYSER=CTX.createAnalyser(); ANALYSER.fftSize=1024; src.connect(ANALYSER);
  /* ScriptProcessor is deprecated but is the one capture node available in every
     browser this tool is likely to meet; the audio clock it reads is the same
     one the stimuli are scheduled against, so frames and schedule stay aligned. */
  PROC=CTX.createScriptProcessor(4096,1,1);
  src.connect(PROC);
  const mute=CTX.createGain(); mute.gain.value=0; PROC.connect(mute); mute.connect(CTX.destination);
  PROC.onaudioprocess=e=>{
    if(!ARM) return;
    /* ScriptProcessor callbacks run on the main thread, so one can arrive late.
       Only the opening boundary is judged by the clock; the closing boundary is
       not, because a late callback would otherwise be read as falling past the
       end of the window and its audio discarded. Capture instead stops when the
       gate is released, one buffer after the window closes, and the exact window
       is cut from the assembled samples afterwards. */
    if(CTX.currentTime>=ARM.start){
      CHUNKS.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    }
  };
  MIC_OK=true;
}
async function listMics(){
  try{
    const ds=await navigator.mediaDevices.enumerateDevices();
    const sel=$("mic"); sel.innerHTML="";
    ds.filter(d=>d.kind==="audioinput").forEach((d,i)=>{
      const o=document.createElement("option");
      o.value=d.deviceId; o.textContent=d.label||("Input "+(i+1)); sel.appendChild(o);
    });
  }catch(e){}
}
/* The meter allocated a fresh array on every frame and kept running through the
   whole session, where it is not even on screen. Both cost main-thread time that
   the capture callback competes for, so the array is reused and the loop is
   stopped while a session is running. */
let METER_BUF=null, METER_ON=false;
function meterLoop(){
  if(!METER_ON) return;
  if(ANALYSER){
    if(!METER_BUF||METER_BUF.length!==ANALYSER.fftSize) METER_BUF=new Uint8Array(ANALYSER.fftSize);
    ANALYSER.getByteTimeDomainData(METER_BUF);
    let peak=0;
    for(let i=0;i<METER_BUF.length;i++) peak=Math.max(peak,Math.abs(METER_BUF[i]-128)/128);
    const l=$("lvl"); if(l) l.style.width=Math.min(100,Math.round(peak*180))+"%";
  }
  requestAnimationFrame(meterLoop);
}
function startMeter(){ if(!METER_ON){ METER_ON=true; requestAnimationFrame(meterLoop); } }
function stopMeter(){ METER_ON=false; }
startMeter();

$("btnRec").onclick=async()=>{

/* ------------------------------------------------------------- WAV / ZIP */
function flatten(chunks){
  let n=0; chunks.forEach(c=>n+=c.length);
  const out=new Float32Array(n); let o=0;
  chunks.forEach(c=>{ out.set(c,o); o+=c.length; });
  return out;
}
function wavBlob(samples,rate){
  const b=new ArrayBuffer(44+samples.length*2), v=new DataView(b);
  const s=(o,str)=>{for(let i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i));};
  s(0,"RIFF"); v.setUint32(4,36+samples.length*2,true); s(8,"WAVE"); s(12,"fmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true);
  v.setUint16(34,16,true); s(36,"data"); v.setUint32(40,samples.length*2,true);
  let o=44;
  for(let i=0;i<samples.length;i++,o+=2){
    const x=Math.max(-1,Math.min(1,samples[i]));
    v.setInt16(o,x<0?x*0x8000:x*0x7fff,true);
  }
  return new Blob([b],{type:"audio/wav"});
}
const CRCT=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}
  return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;}
/* Store-only ZIP: the payload is 16-bit PCM and a short JSON log, so deflating
   would add a dependency for very little. */
async function makeZip(entries){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  for(const e of entries){
    const name=enc.encode(e.name);
    const data=new Uint8Array(await e.blob.arrayBuffer());
    const crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0,true);
    lh.setUint16(8,0,true); lh.setUint16(10,0,true); lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true);
    ch.setUint16(8,0,true); ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true); ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),name);
    off+=30+name.length+data.length;
  }
  let csize=0; central.forEach(c=>csize+=c.length);
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true); eo.setUint16(8,entries.length,true);
  eo.setUint16(10,entries.length,true); eo.setUint32(12,csize,true); eo.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(eo.buffer)],{type:"application/zip"});
}

/* ------------------------------------------------------------- IndexedDB */
const DB_NAME="eit-studio", STORE="handoff";
function idb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(STORE))
      r.result.createObjectStore(STORE,{keyPath:"id"}); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function idbPut(rec){
  const db=await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).put(rec); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  });
}
async function idbDel(key){
  const db=await idb();
  return new Promise(res=>{ const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).delete(key); tx.oncomplete=()=>res(); tx.onerror=()=>res(); });
}
async function idbAll(){
  const db=await idb();
  return new Promise(res=>{ const tx=db.transaction(STORE,"readonly");
    const q=tx.objectStore(STORE).getAll();
    q.onsuccess=()=>res(q.result||[]); q.onerror=()=>res([]); });
}
async function idbClear(){
  const db=await idb();
  return new Promise(res=>{ const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).clear(); tx.oncomplete=()=>res(); tx.onerror=()=>res(); });
}

/* ---- one step at a time --------------------------------------------------
   Only one panel is open. Every step remains on the page as a title row and
   can be opened at any moment: this is a display choice, not a sequence lock,
   so the schedule can still be checked before anything else is done. */
const FOLDP=[...document.querySelectorAll("#setup > .panel")].filter(p=>p.querySelector(".ph"));
function foldOpen(p){
  FOLDP.forEach(x=>x.classList.toggle("fold",x!==p));
  if(p) p.scrollIntoView({block:"nearest",behavior:"smooth"});
}
FOLDP.forEach((p,i)=>{
  if(i>0) p.classList.add("fold");
  p.querySelector(".ph").addEventListener("click",e=>{
    if(e.target.closest("input,select,button,textarea,a")) return;
    if(p.classList.contains("fold")) foldOpen(p);
  });
});
/* After a step is satisfied, move to the first one that is not. */
function foldAdvance(){
  const done=[
    ()=>!!$("pid").value.trim(),
    ()=>STIM.length>0 && TGT.length===STIM.length && STIM.every(s=>s.dur),
    ()=>true,
    ()=>true,
    ()=>MIC_OK && STORE_OK
  ];
  const i=done.findIndex(f=>!f());
  foldOpen(i<0 ? null : FOLDP[i]);
}

/* ------------------------------------------------------------ the session */
let ABORT=false, RESULTS=[], SESSION=null, ENDED_AT=null;
/* Whether the responses for the participant just finished have been saved.
   Starting the next participant clears RESULTS and the stored responses,
   so the button that does so stays disabled until this is true. */
let ZIPPED=false;
/* Once a second participant has been started, the store holds only the most
   recent one, so the scoring handoff is no longer offered as the whole study. */
let MULTI=false;

function showScreen(which){
  $("setup").classList.toggle("hidden",which!=="setup");
  $("run").classList.toggle("hidden",which!=="run");
  $("done").classList.toggle("hidden",which!=="done");
  document.body.classList.toggle("running",which==="run");
  window.scrollTo(0,0);
}
function dots(n,cur){
  $("rDots").innerHTML=Array.from({length:n},(_,i)=>
    "<s class='"+(i<cur?"done":i===cur?"now":"")+"'></s>").join("");
}
function phase(kind,label,head,sub,extra,foot){
  $("rBody").className="pbody "+(kind==="rec"?"tint":"tint2");
  $("rLabel").textContent=label; $("rHead").innerHTML=head; $("rSub").textContent=sub;
  $("rExtra").innerHTML=extra||""; $("rFoot").textContent=foot||"";
}
const WAVE="<div class='pwave'>"+[30,62,88,46,72,100,54,80,38,66,92,44,70,34,58]
  .map(h=>"<s style='height:"+h+"%'></s>").join("")+"</div>";
const BAR="<div class='pbar2'><i id='rFill'></i></div><p class='psecs' id='rSecs'></p>";

function gate(labelKey,headHtml,subKey,btnKey,footKey){
  return new Promise(res=>{
    phase("info",T(labelKey),headHtml,T(subKey),
      "<div style='margin-top:32px'><button class='btn-p' id='gateBtn'>"+T(btnKey)+"</button></div>",
      footKey?T(footKey):"");
    $("gateBtn").onclick=res;
  });
}

/* One item: stimulus → pause → ring tone → response window.
   Every boundary is placed on the audio clock, so the schedule does not drift
   with the page's timers. */
async function runItem(item,idx,total,isPractice){
  const c=consts();
  const win=windowFor(item.dur,item.syl);
  const t0=CTX.currentTime+0.25;
  const tTone=t0+item.dur+c.pause;
  const tOpen=tTone+c.tone;
  const tEnd=tOpen+win;

  const src=CTX.createBufferSource(); src.buffer=item.buf;
  src.connect(CTX.destination); src.start(t0);

  const osc=CTX.createOscillator(), g=CTX.createGain();
  osc.frequency.value=c.hz; osc.connect(g); g.connect(CTX.destination);
  g.gain.setValueAtTime(0,tTone); g.gain.linearRampToValueAtTime(0.22,tTone+0.01);
  g.gain.setValueAtTime(0.22,tOpen-0.01); g.gain.linearRampToValueAtTime(0,tOpen);
  osc.start(tTone); osc.stop(tOpen+0.02);

  CHUNKS=[]; ARM={start:tOpen,end:tEnd};
  const cnt=isPractice?T("cPractice")([idx+1,total]):T("cItem")([idx+1,total]);
  $("rCnt").textContent=cnt; dots(total,idx);

  let mode="";
  await new Promise(res=>{
    (function tick(){
      if(ABORT){ try{src.stop();osc.stop();}catch(e){} return res(); }
      const now=CTX.currentTime;
      if(now<tOpen){
        if(mode!=="listen"){ mode="listen";
          phase("listen",T("phListen"),T("hListen"),T("sListen"),WAVE,
                isPractice?T("fPractice"):T("fTest")); }
      }else{
        if(mode!=="rec"){ mode="rec";
          phase("rec",T("phRepeat"),T("hRepeat"),T("sRepeat"),BAR,
                isPractice?T("fPractice"):T("fTest")); }
        const left=Math.max(0,tEnd-now);
        const fill=$("rFill"); if(fill) fill.style.width=(100*(1-left/win))+"%";
        const secs=$("rSecs"); if(secs) secs.textContent=T("secs")(left);
      }
      if(now>=tEnd) return res();
      requestAnimationFrame(tick);
    })();
  });
  if(!ABORT) await sleep(CAP_GRACE*1000);
  ARM=null;
  const raw=flatten(CHUNKS); CHUNKS=[];
  /* A window cut short by the researcher would look like an omission once it is
     scored, so an interrupted item is discarded rather than kept as a fragment. */
  if(ABORT) return {aborted:true};
  /* Capture is deliberately allowed to run a little past the window, so the
     stored file is cut back to exactly the window here. */
  const want=Math.round(win*SR);
  const samples=raw.subarray(0,Math.min(raw.length,want));
  return {blob:wavBlob(samples,SR),win,dur:item.dur,
          captured_s:+(samples.length/SR).toFixed(3)};
}

$("btnEnd").onclick=()=>{ if(confirm(T("confirmEnd"))) ABORT=true; };

$("btnStart").onclick=async()=>{
  ABORT=false; RESULTS=[]; ENDED_AT=null;
  const pid=$("pid").value.trim().replace(/[^\w.-]+/g,"_");
  SESSION={pid,started:new Date().toISOString(),
           schedule:consts(),practice:$("pracLang").value,items:[]};
  if(!(await confirmOverwrite())) return;
  stopMeter();
  await idbClear();
  /* The session record is written now rather than at the end, so that an
     interrupted session can still be identified and its responses recovered. */
  try{ await idbPut({id:"meta",...SESSION,targets:TGT,total_items:STIM.length,
                     in_progress:true}); }catch(e){}
  showScreen("run");
  try{ if(CTX.state==="suspended") await CTX.resume(); }catch(e){}

  if(PRAC.length){
    $("rCnt").textContent=""; $("rDots").innerHTML="";
    await gate("iLabel","<span>"+T("iHead")+"</span>","iSub","iBtn","fPractice");
    for(let i=0;i<PRAC.length && !ABORT;i++)
      await runItem({buf:PRAC[i].buf,dur:PRAC[i].dur,syl:PRAC[i].syl},i,PRAC.length,true);
  }
  if(!ABORT){
    $("rCnt").textContent=""; $("rDots").innerHTML="";
    await gate("tLabel",T("tHeadA")+"<br>"+STIM.length+" "+T("tHeadB"),"tSub","tBtn");
  }
  for(let i=0;i<STIM.length && !ABORT;i++){
    const syl=TGT[i]?TGT[i][2]:consts().thr;
    const r=await runItem({buf:STIM[i].buf,dur:STIM[i].dur,syl},i,STIM.length,false);
    if(r.aborted){ ENDED_AT=i+1; break; }
    const name=pid+"_item"+String(i+1).padStart(2,"0")+".wav";
    const rec={n:i+1,name,target:TGT[i]?TGT[i][1]:"",syl,
               stimulus:STIM[i].name,stimulus_s:+STIM[i].dur.toFixed(3),
               window_s:+r.win.toFixed(3),
               captured_s:r.captured_s};
    RESULTS.push({...rec,blob:r.blob});
    SESSION.items.push(rec);
    try{ await idbPut({id:"item-"+String(i+1).padStart(2,"0"),...rec,blob:r.blob}); }catch(e){}
  }
  ARM=null;
  SESSION.ended=new Date().toISOString();
  SESSION.ended_early=!!ABORT; SESSION.ended_at_item=ENDED_AT;
  SESSION.total_items=STIM.length; SESSION.recorded=RESULTS.length;
  SESSION.sample_rate=SR;
  try{ await idbPut({id:"meta",...SESSION,targets:TGT,in_progress:false}); }catch(e){}
  finish();
};

function finish(){
  startMeter();
  showScreen("done");
  $("dSum").textContent=SESSION.ended_early
    ? T("fmtEnded")(RESULTS.length,SESSION.pid,ENDED_AT||RESULTS.length,SESSION.total_items)
    : T("fmtDone")(RESULTS.length,SESSION.pid);
  ZIPPED=false; paintNext();
  $("dRows").innerHTML=RESULTS.map(r=>
      "<tr><td>"+r.name+"</td><td>“"+r.target+"”</td><td>"+r.window_s.toFixed(1)+" s</td></tr>")
      .join("")+"<tr><td>"+SESSION.pid+"_session.json</td><td>"+
      "schedule, item order, timestamps"+"</td><td>—</td></tr>";
}

$("btnZip").onclick=async()=>{
  const entries=RESULTS.map(r=>({name:r.name,blob:r.blob}));
  const log={...SESSION};
  entries.push({name:SESSION.pid+"_session.json",
                blob:new Blob([JSON.stringify(log,null,2)],{type:"application/json"})});
  entries.push({name:SESSION.pid+"_targets.txt",
                blob:new Blob([TGT.map(r=>r.join("\t")).join("\n")],{type:"text/plain"})});
  const zip=await makeZip(entries);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(zip); a.download=SESSION.pid+"_eit.zip"; a.click();
  ZIPPED=true; paintNext();
};
/* In a multi-participant run the store is cleared on the way out, so the
   scoring page cannot offer the last participant alone as though it were the
   study. Those responses have already been downloaded by this point. */
$("btnScore").onclick=async()=>{
  if(MULTI){ try{ await idbClear(); }catch(e){} }
  location.href=MULTI?"app.html":"app.html?from=administer";
};

/* ------------------------------------------------- another participant ---
   The sentence set, the stimulus audio and the practice items are already in
   memory and are not touched here, so a second participant can be started
   without loading anything again. Only the per-participant state is cleared. */
function paintNext(){
  const b=$("btnNext"); if(!b) return;
  b.disabled=!ZIPPED;
  $("dNextNote").textContent=ZIPPED?T("dNextReady"):T("dNextLocked");
  $("dChoose").textContent=T("dChoose");
  $("dScoreB").textContent=MULTI?T("dScoreM"):T("dScore");
  $("dScoreI").textContent=MULTI?T("dScoreMS"):T("dScoreS");
}
async function nextParticipant(){
  RESULTS=[]; SESSION=null; ENDED_AT=null; ABORT=false; ZIPPED=false; MULTI=true;
  $("dSum").textContent=""; $("dRows").innerHTML="";
  /* The store held the responses just downloaded; clearing it now keeps the
     unfinished-session banner from offering them back as a recovery. */
  try{ await idbClear(); }catch(e){}
  LEFTOVER=0; $("recover").classList.add("hidden");
  $("pid").value="";
  showScreen("setup");
  paintStart();
  foldAdvance();
  $("pid").focus();
}
$("btnNext").onclick=nextParticipant;

/* ------------------------------------------------- unfinished session ----
   Responses are written item by item, so a session cut short by a reload,
   a closed tab, or a power failure leaves its recordings in storage. They
   are of no use unless the researcher is told they are there, and starting
   a new session clears the store, so both are handled here. */
let LEFTOVER=0;
async function checkLeftover(){
  try{
    const all=await idbAll();
    const items=all.filter(r=>/^item-/.test(r.id)&&r.blob);
    const meta=all.find(r=>r.id==="meta");
    if(!items.length){ LEFTOVER=0; return; }
    if(meta && meta.in_progress===false && meta.recorded===meta.total_items){
      LEFTOVER=0; return;            /* a completed session, already offered on the scoring page */
    }
    LEFTOVER=items.length;
    $("recN").textContent=T("fmtRec")(items.length,(meta&&meta.pid)||"—");
    $("recover").classList.remove("hidden");
  }catch(e){ LEFTOVER=0; }
}
async function confirmOverwrite(){
  if(!LEFTOVER) return true;
  return confirm(T("fmtDiscard")(LEFTOVER));
}
$("recGo").onclick=()=>{ location.href="app.html?from=administer"; };
$("recDrop").onclick=async()=>{
  if(!confirm(T("fmtDiscard")(LEFTOVER))) return;
  await idbClear(); LEFTOVER=0; $("recover").classList.add("hidden");
};

/* -------------------------------------------------------------- start-up */
(async()=>{
  applyLang();
  await loadPractice();
  await listMics();
  paintSchedule(); paintTally(); paintStart();
  await checkLeftover();
})();
window.addEventListener("beforeunload",e=>{
  if(!$("run").classList.contains("hidden")||(RESULTS.length&&!$("done").classList.contains("hidden"))){
    e.preventDefault(); e.returnValue="";
  }
});
</script>
