<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EIT Studio</title>
<style>
  :root{
    --bg:#f2f2f4; --panel:#fff; --ink:#17171c; --muted:#6b6b76; --line:#e3e3e8;
    --accent:#3840f3; --accent-dark:#2a31d4; --accent-soft:#eef0ff;
    --pink:#ff1493; --pink-soft:#fff0f8; --sev:#be185d;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
    "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    padding:66px 18px 60px; display:flex; flex-direction:column; align-items:center}
  .hd{position:fixed; top:0; left:0; right:0; z-index:20; height:50px;
    background:rgba(242,242,244,.95); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 22px}
  .hd .t{font-weight:700; font-size:15px}
  .hd .t span{font-weight:400; color:var(--muted); font-size:11px; margin-left:9px;
    text-transform:uppercase; letter-spacing:.08em}
  .tabs2{display:flex; gap:6px; margin-left:auto; margin-right:14px}
  .tabs2 a{font-size:12.5px; font-weight:600; text-decoration:none; color:var(--muted);
    padding:5px 12px; border-radius:8px; border:1px solid transparent; white-space:nowrap}
  .tabs2 a:hover{color:var(--ink); background:#f0f0f5}
  .tabs2 a.on{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent)}
  .hd .rt{display:flex; align-items:center; gap:12px}
  .hd .badge{font-family:var(--mono); font-size:11.5px; color:var(--muted)}
  .lang{display:flex; border:1px solid #d4d4d8; border-radius:7px; overflow:hidden}
  .lang button{font-size:12px; font-weight:600; padding:5px 11px; border:none;
    background:#fff; color:#52525b; border-radius:0}
  .lang button.on{background:var(--accent); color:#fff}
  .stage{width:100%; max-width:1280px}
  .hero{padding:22px 4px 18px; display:flex; align-items:baseline; gap:14px;
    flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:20px}
  .hero-t{margin:0; font-size:19px; line-height:1.2; font-weight:800;
    letter-spacing:-.5px; color:var(--ink)}
  .hero-t span{color:var(--accent)}
  .hero-s{margin:0; flex:1 1 340px; font-size:12.5px; line-height:1.6; color:var(--muted)}
  .hero-back{font-size:12.5px; color:var(--accent); text-decoration:none; font-weight:600;
    white-space:nowrap}
  .hero-back:hover{text-decoration:underline}
  @media(max-width:640px){ .hero{padding:16px 4px 14px} }
  .panel{background:var(--panel); border:1px solid #dcdce2; border-radius:12px;
    margin-bottom:16px; overflow:hidden}
  .pad{padding:20px 24px}
  .step{display:flex; align-items:center; gap:10px; margin-bottom:10px}
  .step .n{width:22px; height:22px; border-radius:50%; background:var(--accent);
    color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center;
    justify-content:center; flex:none}
  .step h2{font-size:16px; margin:0; letter-spacing:-.01em}
  .step .ok{margin-left:auto; font-size:12px; color:var(--accent); font-weight:600}
  .meta{font-size:12.5px; color:var(--muted); margin:0 0 12px}
  button{font:inherit; font-weight:600; cursor:pointer; border-radius:8px;
    padding:9px 18px; border:1px solid transparent}
  button:disabled{opacity:.4; cursor:not-allowed}
  .btn-p{background:var(--accent); color:#fff}
  .btn-p:hover:not(:disabled){background:var(--accent-dark)}
  .btn-g{background:#fff; color:#3f3f46; border-color:#d4d4d8}
  .btn-g:hover:not(:disabled){background:var(--accent-soft)}
  .btn-s{font-size:12.5px; padding:6px 12px; border-radius:6px}
  select,input[type=text]{font:inherit; padding:6px 10px; border:1px solid #d4d4d8;
    border-radius:7px; background:#fff; font-size:13px}
  textarea{font-family:var(--mono); font-size:12.5px; width:100%; min-height:120px;
    padding:10px 12px; border:1px solid #d4d4d8; border-radius:8px; resize:vertical;
    line-height:1.6}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px}
  .drop{border:2px dashed #c9c9d2; border-radius:10px; padding:24px 20px; text-align:center;
    color:var(--muted); font-size:14px; margin:12px 0; cursor:pointer}
  .drop.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
  .prog{height:6px; background:var(--line); border-radius:3px; overflow:hidden; flex:1; min-width:110px}
  .prog div{height:100%; background:var(--accent); width:0%; transition:width .2s}
  .status{font-size:13px; color:var(--muted); min-height:20px; margin-top:9px; font-family:var(--mono)}
  .warnbox{background:var(--pink-soft); border:1px solid #fbcfe8; color:var(--sev);
    border-radius:8px; padding:9px 13px; font-size:12.5px; margin-top:10px}
  .infobox{background:var(--accent-soft); border:1px solid #c7d2fe; color:#3730a3;
    border-radius:8px; padding:9px 13px; font-size:12.5px; margin-top:10px}
  .hidden{display:none}
  label.chk{display:inline-flex; align-items:center; gap:7px; font-size:13px; cursor:pointer}
  details{margin-top:10px} summary{cursor:pointer; font-size:13px; color:var(--accent); font-weight:600}
  table{width:100%; border-collapse:collapse; font-size:13.5px}
  th{text-align:left; font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--muted); font-weight:600; padding:9px 12px; border-bottom:1px solid var(--line);
    background:#fafafb; white-space:nowrap}
  td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top}
  tbody tr:hover td{background:#fbfbfd}
  .sumhead{display:flex; align-items:baseline; gap:16px; padding:16px 22px 10px; flex-wrap:wrap}
  .sumhead h2{font-size:16px; margin:0}
  .sumhead .right{margin-left:auto; display:flex; gap:8px; align-items:center}
  .sumtab th{border-top:1px solid var(--line)}
  .sumtab td{font-variant-numeric:tabular-nums}
  .sumtab .pid{font-weight:700}
  .itemtab thead th{position:sticky; top:50px; z-index:5}
  .c-pid{font-weight:600; white-space:nowrap}
  .c-it{font-family:var(--mono); font-size:12.5px; color:var(--muted); white-space:nowrap}
  .c-tgt{font-family:var(--mono); font-size:12.5px; color:var(--muted); line-height:1.7}
  .c-hyp{font-family:var(--mono); font-size:12.5px; line-height:1.7}
  .c-n{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
  .acc{font-size:14px; font-weight:700; color:var(--accent)}
  .acc.low{color:var(--sev)}
  .pill{display:inline-block; min-width:48px; text-align:center; border-radius:4px;
    padding:2px 7px; font-weight:600; font-size:12.5px}
  .p0{background:#eef2ff; color:#4338ca}
  .p1{background:#f4f4f5; color:#52525b}
  .p2{background:var(--pink-soft); color:var(--sev)}
  .conf{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right;
    color:var(--muted); white-space:nowrap; font-size:11.5px}
  .conf b{color:var(--ink); font-size:13px; font-weight:600}
  .mini{background:none; border:1px solid var(--line); border-radius:5px; width:26px;
    height:26px; cursor:pointer; color:var(--accent); font-size:10px; padding:0}
  .errcell{color:var(--sev); font-size:12.5px}
  .w-sub{background:#cffafe; border-radius:3px; padding:0 3px}
  .w-ins{background:#fbcfe8; border-radius:3px; padding:0 3px}
  .w-om{color:#db2777; font-weight:700}
  .foot{font-size:11.5px; color:var(--muted); padding:11px 22px;
    border-top:1px solid var(--line); background:#fafafb; font-family:var(--mono)}
  .maptab td{padding:6px 10px}
  .maptab input[type=text]{width:100%; padding:4px 8px; font-size:12.5px}
  .maptab .unmatched td{background:var(--pink-soft)}
  .tgt-inline{display:none}
  @media(max-width:900px){
    body{padding-left:10px; padding-right:10px}
    .itemtab th:nth-child(3), .itemtab td:nth-child(3){display:none}
    .tgt-inline{display:block; color:var(--muted); margin-bottom:2px}
    .itemtab th, .itemtab td{padding:9px 8px}
  }
</style>
</head>
<body>
<div class="hd">
  <div class="t" id="brand"><a href="index.html" style="text-decoration:none; color:inherit"
     >EIT&nbsp;Studio</a><span data-i18n="hdSub"></span></div>
  <div class="tabs2">
    <a href="start.html" data-i18n="tabStart"></a>
    <a href="app.html" class="on" data-i18n="tabScore"></a>
    <a href="segment.html" data-i18n="tabSeg"></a>
  </div>
  <div class="rt">
    <span class="badge" id="gpuBadge"></span>
    <span class="lang"><button id="langEn">English</button><button id="langKo">한국어</button></span>
  </div>
</div>
<div class="stage">

  <div class="hero">
    <h1 class="hero-t">EIT <span>Studio</span></h1>
    <p class="hero-s" data-i18n="heroSub"></p>
    <a class="hero-back" href="index.html" data-i18n="heroBack"></a>
  </div>

  <!-- ============ STEP 1 : target set ============ -->
  <div class="panel"><div class="pad">
    <div class="step"><span class="n">1</span><h2 data-i18n="s1Title"></h2>
      <span class="ok" id="s1Ok"></span></div>
    <p class="meta" data-i18n="s1Help"></p>
    <div class="row">
      <button class="btn-g btn-s" id="loadPreset" data-i18n="btnPreset"></button>
      <button class="btn-g btn-s" id="tgtFileBtn" data-i18n="btnTgtFile"></button>
      <input type="file" id="tgtFile" accept=".csv,.tsv,.txt" style="display:none">
      <button class="btn-g btn-s" id="clearTgt" data-i18n="btnClearTgt"></button>
    </div>
    <textarea id="tgtBox" spellcheck="false"></textarea>
    <div class="row">
      <button class="btn-p btn-s" id="applyTgt" data-i18n="btnApplyTgt"></button>
      <span class="meta" id="tgtInfo" style="margin:0"></span>
    </div>
    <div class="warnbox hidden" id="tgtWarn"></div>
  </div></div>

  <!-- ============ STEP 2 : normalizer ============ -->
  <div class="panel"><div class="pad">
    <div class="step"><span class="n">2</span><h2 data-i18n="s2Title"></h2></div>
    <p class="meta" data-i18n="s2Help"></p>
    <div class="row">
      <label class="chk"><input type="checkbox" id="optNum" checked><span data-i18n="optNum"></span></label>
      <label class="chk"><input type="checkbox" id="optContr" checked><span data-i18n="optContr"></span></label>
    </div>
    <details id="ruleDetails">
      <summary data-i18n="ruleSummary"></summary>
      <p class="meta" style="margin-top:8px" data-i18n="ruleHelp"></p>
      <textarea id="ruleBox" spellcheck="false" style="min-height:90px"></textarea>
      <div class="row">
        <button class="btn-g btn-s" id="applyRules" data-i18n="btnApplyRules"></button>
        <button class="btn-g btn-s" id="expCfg" data-i18n="btnExpCfg"></button>
        <button class="btn-g btn-s" id="impCfgBtn" data-i18n="btnImpCfg"></button>
        <input type="file" id="impCfg" accept=".json" style="display:none">
      </div>
    </details>
    <div class="infobox" id="normPreview"></div>
  </div></div>

  <!-- ============ STEP 3 : audio ============ -->
  <div class="panel"><div class="pad">
    <div class="step"><span class="n">3</span><h2 data-i18n="s3Title"></h2>
      <a href="segment.html" style="margin-left:auto; font-size:12.5px; font-weight:600;
         color:var(--accent); text-decoration:none" data-i18n="segLink"></a></div>
    <p class="meta" data-i18n="s3Help"></p>
    <div class="row">
      <label class="meta" style="margin:0" data-i18n="modelLbl"></label>
      <select id="modelSel">
        <option value="onnx-community/whisper-large-v3-turbo" data-i18n="optTurbo"></option>
        <option value="Xenova/whisper-small" data-i18n="optSmall"></option>
      </select>
    </div>
    <p class="meta" id="speedNote" data-i18n="speedNote"
       style="background:var(--accent-soft); border-radius:8px; padding:10px 13px;
              line-height:1.65; margin:2px 0 12px"></p>
    <div class="drop" id="drop"><span id="dropMsg"></span>
      <input type="file" id="fileIn" multiple accept="audio/*" style="display:none">
    </div>
    <div id="mapWrap" class="hidden">
      <details id="mapDetails">
        <summary id="mapSummary"></summary>
        <table class="maptab"><thead><tr>
          <th data-i18n="thFile"></th>
          <th style="width:150px" data-i18n="thPid"></th>
          <th style="width:90px" data-i18n="thItem"></th>
        </tr></thead><tbody id="mapRows"></tbody></table>
      </details>
    </div>
    <div class="row">
      <button class="btn-p" id="runBtn" disabled data-i18n="btnRun"></button>
      <button class="btn-g" id="resetBtn" data-i18n="btnReset"></button>
      <div class="prog"><div id="progFill"></div></div>
    </div>
    <div class="status" id="status"></div>
    <div class="warnbox hidden" id="wgpuWarn" data-i18n="wgpuWarn"></div>
    <div class="warnbox hidden" id="dlWarn" data-i18n="dlWarn"></div>
    <div class="infobox hidden" id="confWarn" data-i18n="confWarn"></div>
  </div></div>

  <!-- ============ results ============ -->
  <div class="panel hidden" id="resPanel">
    <div class="sumhead">
      <h2 data-i18n="resTitle"></h2>
      <a href="index.html#reading" style="font-size:12.5px; font-weight:600; color:var(--accent);
         text-decoration:none; margin-left:12px" data-i18n="readGuide"></a>
      <span class="right">
        <select id="sortSel">
          <option value="item" data-i18n="sortItem"></option>
          <option value="acc" data-i18n="sortAcc"></option>
          <option value="conf" data-i18n="sortConf"></option>
        </select>
        <button class="btn-g btn-s" id="csvBtn">CSV</button>
        <button class="btn-g btn-s" id="jsonBtn">JSON</button>
      </span>
    </div>
    <table class="sumtab"><thead><tr>
      <th data-i18n="thPid"></th>
      <th style="width:90px; text-align:right" data-i18n="thNItems"></th>
      <th style="width:120px; text-align:right" data-i18n="thMAcc"></th>
      <th style="width:100px; text-align:right" data-i18n="thMWer"></th>
      <th style="width:120px; text-align:right" data-i18n="thMConf"></th>
    </tr></thead><tbody id="sumRows"></tbody></table>
  </div>

  <div class="panel hidden" id="tabPanel">
    <table class="itemtab"><thead><tr>
      <th style="width:96px" data-i18n="thPid"></th>
      <th style="width:56px" data-i18n="thItem"></th>
      <th data-i18n="thTarget"></th>
      <th data-i18n="thWhisper"></th>
      <th style="width:76px; text-align:right" data-i18n="thAcc"></th>
      <th style="width:66px; text-align:right">WER</th>
      <th style="width:112px; text-align:right" data-i18n="thConf"></th>
      <th style="width:58px; text-align:center" data-i18n="thAudio"></th>
    </tr></thead><tbody id="rows"></tbody></table>
    <div class="foot" id="foot"></div>
  </div>
</div>

<script type="module">

   built-in preset: EIT A (Ortega et al., 2002)
   ============================================================ */

/* ---------- ASR target language ---------- */
/* Whisper large-v3-turbo is multilingual. WER is a whitespace-delimited
   word-level metric, so it is not directly interpretable for languages
   without word spacing (zh, ja) or with agglutinative eojeol spacing (ko). */
/* This build is scoped to English EIT. Whisper large-v3-turbo is multilingual,
   but the normalizer and the whitespace-based WER are English-specific, and
   ASR-human agreement for EIT scoring has only been reported for English
   (McGuire & Larson-Hall, 2025). */
const ASR_LANG="en";

/* ============================================================
   NORMALIZER (configurable)
   ============================================================ */
const ONES=["zero","one","two","three","four","five","six","seven","eight","nine","ten",
"eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function n2w(n){
  n=parseInt(n,10);
  if(n<20) return ONES[n];
  if(n<100) return TENS[Math.floor(n/10)]+(n%10?" "+ONES[n%10]:"");
  if(n<1000) return ONES[Math.floor(n/100)]+" hundred"+(n%100?" "+n2w(n%100):"");
  if(n<1000000) return n2w(Math.floor(n/1000))+" thousand"+(n%1000?" "+n2w(n%1000):"");
  return n2w(Math.floor(n/1000000))+" million"+(n%1000000?" "+n2w(n%1000000):"");
}
const ORD={"1st":"first","2nd":"second","3rd":"third","4th":"fourth","5th":"fifth",
"6th":"sixth","7th":"seventh","8th":"eighth","9th":"ninth","10th":"tenth",
"11th":"eleventh","12th":"twelfth","13th":"thirteenth","20th":"twentieth","21st":"twenty first"};
const CONTR={
 "i'm":"i am","you're":"you are","we're":"we are","they're":"they are",
 "i've":"i have","you've":"you have","we've":"we have","they've":"they have",
 "could've":"could have","would've":"would have","should've":"should have",
 "might've":"might have","must've":"must have",
 "i'll":"i will","you'll":"you will","he'll":"he will","she'll":"she will",
 "it'll":"it will","we'll":"we will","they'll":"they will","that'll":"that will",
 "there'll":"there will","who'll":"who will",
 "i'd":"i would","you'd":"you would","he'd":"he would","she'd":"she would",
 "we'd":"we would","they'd":"they would","that'd":"that would",
 "it's":"it is","he's":"he is","she's":"she is","that's":"that is",
 "there's":"there is","here's":"here is","what's":"what is","who's":"who is",
 "where's":"where is","when's":"when is","how's":"how is","let's":"let us",
 "don't":"do not","doesn't":"does not","didn't":"did not",
 "isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not",
 "hasn't":"has not","haven't":"have not","hadn't":"had not",
 "won't":"will not","wouldn't":"would not","can't":"cannot","couldn't":"could not",
 "shouldn't":"should not","mustn't":"must not","needn't":"need not",
 "ain't":"is not","shan't":"shall not"
};
const DEFAULT_RULES="town house => townhouse\ntown houses => townhouses";
let CFG={ numbers:true, contractions:true, rulesText:DEFAULT_RULES, rules:[] };

function compileRules(text){
  const out=[];
  String(text||"").split(/\n+/).forEach(line=>{
    const m=line.split("=>");
    if(m.length<2) return;
    const from=m[0].trim().toLowerCase(), to=m.slice(1).join("=>").trim().toLowerCase();
    if(!from) return;
    out.push({from,to});
  });
  out.sort((a,b)=>b.from.length-a.from.length);   /* longest phrase first */
  return out;
}
function esc4re(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }

function normalize(s){
  s=String(s).toLowerCase().replace(/[‘’]/g,"'");
  if(CFG.numbers){
    s=s.replace(/\b(\d{1,2}):(\d{2})\b/g,(m,h,mn)=>{
      h=parseInt(h,10); mn=parseInt(mn,10);
      if(mn===0) return n2w(h)+" o'clock";
      if(mn<10)  return n2w(h)+" oh "+n2w(mn);
      return n2w(h)+" "+n2w(mn);
    });
    s=s.replace(/(\d),(\d{3})\b/g,"$1$2");
    s=s.replace(/\b(\d+)(st|nd|rd|th)\b/g,m=>ORD[m]||n2w(m.replace(/\D/g,"")));
    s=s.replace(/(\d+)\s*%/g,(m,d)=>n2w(d)+" percent");
    s=s.replace(/\b\d+\b/g,m=>n2w(m));
  }
  if(CFG.contractions) s=s.replace(/[a-z]+'[a-z]+/g,m=>CONTR[m]||m);
  s=s.replace(/[^a-z0-9' ]/g," ");
  s=s.replace(/\s+/g," ").trim();
  CFG.rules.forEach(r=>{ s=s.replace(new RegExp("\\b"+esc4re(r.from)+"\\b","g"), r.to); });
  return s.replace(/\s+/g," ").trim();
}

/* ---------- alignment / WER ---------- */
function align(refW,hypW){
  const n=refW.length,m=hypW.length;
  const D=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=0;i<=n;i++)D[i][0]=i;
  for(let j=0;j<=m;j++)D[0][j]=j;
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){
    const c=refW[i-1]===hypW[j-1]?0:1;
    D[i][j]=Math.min(D[i-1][j-1]+c,D[i-1][j]+1,D[i][j-1]+1);
  }
  const raw=[]; let i=n,j=m;
  while(i>0||j>0){
    if(i>0&&j>0&&D[i][j]===D[i-1][j-1]+(refW[i-1]===hypW[j-1]?0:1)){
      raw.push({t:refW[i-1]===hypW[j-1]?"eq":"sub",r:[refW[i-1]],h:[hypW[j-1]]}); i--; j--;
    }else if(i>0&&D[i][j]===D[i-1][j]+1){ raw.push({t:"del",r:[refW[i-1]],h:[]}); i--; }
    else{ raw.push({t:"ins",r:[],h:[hypW[j-1]]}); j--; }
  }
  raw.reverse();
  const ops=[]; let S=0,Dl=0,I=0;
  for(const o of raw){
    if(o.t==="sub")S++; else if(o.t==="del")Dl++; else if(o.t==="ins")I++;
    const last=ops[ops.length-1];
    if(last&&last.t===o.t){ last.r.push(...o.r); last.h.push(...o.h); }
    else ops.push({t:o.t,r:[...o.r],h:[...o.h]});
  }
  return {ops,S,D:Dl,I};
}
function scorePair(target,hyp){
  const gt=normalize(target), tr=normalize(hyp);
  const refW=gt?gt.split(" "):[];
  if(!tr) return {wer:1,acc:0,ops:[],gt,tr};
  const {ops,S,D,I}=align(refW,tr.split(" "));
  const wer=refW.length?Math.min(1,(S+D+I)/refW.length):1;
  return {wer:+wer.toFixed(4),acc:+((1-wer)*100).toFixed(1),ops,gt,tr};
}

/* ============================================================
   STEP 1 — target set
   ============================================================ */
let TARGETS={}, TGT_SYL={}, TGT_N=0;

function parseTargets(text){
  const items=[], bad=[];
  let auto=0;
  String(text||"").split(/\r?\n/).forEach(line=>{
    const raw=line.trim();
    if(!raw) return;
    let cells;
    if(raw.indexOf("\t")>=0) cells=raw.split("\t").map(c=>c.trim());
    else cells=csvSplit(raw);
    /* The syllable count is required: it defines the response window in the
       administration timing, and the segmenter needs it to place item
       boundaries when a participant produced no audible response. */
    if(cells.length>=2 && /^(item|number|no|num|번호)$/i.test(cells[0])) return;   /* header */
    if(cells.length>=3 && /^\d+$/.test(cells[0]) && /^\d+$/.test(cells[2])){
      const n=parseInt(cells[0],10), sent=cells[1], syl=parseInt(cells[2],10);
      if(!sent||!syl){ bad.push(raw); return; }
      items.push([n,sent,syl]);
    }else if(cells.length===2 && /^\d+$/.test(cells[1]) && cells[0] &&
             !/^\d+$/.test(cells[0])){
      items.push([++auto,cells[0],parseInt(cells[1],10)]);          /* sentence, syllables */
    }else bad.push(raw);
  });
  /* renumber auto-numbered lines so they do not clash with explicit numbers */
  if(items.some(x=>x[0]===null)) items.forEach((x,i)=>{ if(x[0]===null) x[0]=i+1; });
  return {items,bad};
}
function csvSplit(line){
  const out=[]; let cur="", q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(q){
      if(c==='"' && line[i+1]==='"'){ cur+='"'; i++; }
      else if(c==='"') q=false;
      else cur+=c;
    }else{
      if(c==='"') q=true;
      else if(c===","){ out.push(cur.trim()); cur=""; }
      else cur+=c;
    }
  }
  out.push(cur.trim());
  return out;
}
function applyTargets(text,quiet){
  const {items,bad}=parseTargets(text);
  TARGETS={}; TGT_SYL={};
  items.forEach(([n,s,syl])=>{ TARGETS[n]=s; if(syl) TGT_SYL[n]=syl; });
  TGT_N=items.length;
  if(bad.length){
    $("tgtWarn").classList.remove("hidden");
    $("tgtWarn").textContent=T("fmtTgtWarn")(bad.length, bad.slice(0,2).join(" | "));
  } else { $("tgtWarn").classList.add("hidden"); $("tgtWarn").textContent=""; }
  paintTargetInfo(); paintNormPreview();
  if(!quiet) setStatus(TGT_N ? (MODEL?"stReadyCached":"stPick") : "stNoTarget");
}
function paintTargetInfo(){
  $("tgtInfo").textContent = TGT_N ? T("fmtTgtInfo")(TGT_N) : T("tgtNone");
  $("s1Ok").textContent = TGT_N ? "✓ "+T("s1Ok") : "";
}

    $("optNum").checked=!!j.spell_out_numbers;
    $("optContr").checked=!!j.expand_contractions;
    $("ruleBox").value=(j.extra_rules||[]).map(r=>r.from+" => "+r.to).join("\n");
    readCfgFromUI();
    $("ruleDetails").open=true;
  }catch(err){ alert(String(err&&err.message||err)); }
  e.target.value="";
};

/* ============================================================
   audio decode / model / transcription
   ============================================================ */
let DEC_CTX=null;
async function decodeTo16k(file){
  const buf=await file.arrayBuffer();
  if(!DEC_CTX) DEC_CTX=new (window.AudioContext||window.webkitAudioContext)();
  const audio=await DEC_CTX.decodeAudioData(buf);
  const off=new OfflineAudioContext(1,Math.max(1,Math.ceil(audio.duration*16000)),16000);
  const src=off.createBufferSource(); src.buffer=audio; src.connect(off.destination); src.start();
  const out=await off.startRendering();
  return {data:out.getChannelData(0),dur:audio.duration};
}
const MAX_TRIES=5;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const hasGPU=!!navigator.gpu;
$("gpuBadge").textContent=hasGPU?"WebGPU ✓":"CPU (WASM)";
if(!hasGPU) $("wgpuWarn").classList.remove("hidden");
let libCache=null,MODEL=null,PROC=null,TOK=null,loadedModel=null,confAvailable=true;

async function loadLib(){
  if(libCache) return libCache;
  const urls=["https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.4.0",
              "https://unpkg.com/@huggingface/transformers@3.4.0"];
  let last=null;
  for(let t=1;t<=MAX_TRIES;t++){
    try{ libCache=await import(urls[(t-1)%urls.length]); return libCache; }
    catch(e){ last=e; setStatus("stLibRetry",t,MAX_TRIES);
      if(t<MAX_TRIES) await sleep(Math.min(1000*2**t,8000)); }
  }
  throw new Error(T("errLib")(last&&last.message||last));
}
async function loadModel(id){
  if(MODEL&&loadedModel===id) return;
  const lib=await loadLib();
  const {AutoProcessor,AutoTokenizer,WhisperForConditionalGeneration}=lib;
  const dtype=id.includes("turbo")?{encoder_model:"fp16",decoder_model_merged:"q4"}:"q8";
  let last=null;
  for(let t=1;t<=MAX_TRIES;t++){
    setStatus("stLoad",t,MAX_TRIES);
    try{
      const cb=p=>{ if(p.status==="progress"&&p.total)
        setStatus("fmtDl",t,MAX_TRIES,p.file,Math.round(p.progress)); };
      PROC=await AutoProcessor.from_pretrained(id,{progress_callback:cb});
      TOK =await AutoTokenizer.from_pretrained(id,{progress_callback:cb});
      MODEL=await WhisperForConditionalGeneration.from_pretrained(id,
        {dtype,device:hasGPU?"webgpu":"wasm",progress_callback:cb});
      loadedModel=id; $("dlWarn").classList.add("hidden"); return;
    }catch(e){
      last=e; MODEL=null;
      if(!navigator.onLine) throw new Error(T("errOffline"));
      if(t<MAX_TRIES){
        $("dlWarn").classList.remove("hidden");
        for(let s=Math.min(2**t,15);s>0;s--){ setStatus("fmtWait",s); await sleep(1000); }
      }
    }
  }
  throw new Error(T("errModel")(MAX_TRIES,last&&last.message||last));
}
async function transcribe(audio){
  const {LogitsProcessor,LogitsProcessorList}=libCache;
  const inputs=await PROC(audio);
  let prev=null,prevLen=0,sumLP=0,nTok=0,ok=true;
  const lastRow=t=>{ const d=t&&t.data; if(!d||!d.length) return null;
    const v=t.dims[t.dims.length-1]; return d.length>v?d.subarray(d.length-v):d; };
  const step=(row,tok)=>{
    let mx=-Infinity; for(let i=0;i<row.length;i++) if(row[i]>mx) mx=row[i];
    let se=0; for(let i=0;i<row.length;i++) se+=Math.exp(row[i]-mx);
    sumLP+=(row[tok]-mx)-Math.log(se); nTok++;
  };
  class Conf extends LogitsProcessor{
    _call(input_ids,logits){
      try{
        const ids=Array.from(input_ids[0]).map(Number);
        const row=lastRow(logits);
        if(!row){ ok=false; return logits; }
        if(prev&&ids.length===prevLen+1) step(prev,ids[ids.length-1]);
        prev=Float32Array.from(row); prevLen=ids.length;
      }catch(e){ ok=false; }
      return logits;
    }
  }
  const lpl=new LogitsProcessorList(); lpl.push(new Conf());
  /* Decoding is fixed and deterministic. Greedy search with sampling off is the
     temperature-0 case: the same recording always yields the same transcription,
     which is what a scoring procedure has to guarantee. No prompt or vocabulary
     bias is supplied — the recognizer is never told the target sentence, because
     doing so would suppress exactly the deviations the task measures. Each file
     is decoded on its own, so one item cannot condition the next. */
  const out=await MODEL.generate({...inputs,max_new_tokens:128,language:ASR_LANG,
    task:"transcribe",do_sample:false,num_beams:1,temperature:0,
    logits_processor:lpl,return_dict_in_generate:true});
  const seq=out.sequences?out.sequences:out;
  const ids=Array.from(seq.tolist()[0]).map(Number);
  if(ok&&prev&&ids.length===prevLen+1) step(prev,ids[ids.length-1]);
  const text=TOK.decode(ids,{skip_special_tokens:true}).trim();
  const avg=(ok&&nTok)?sumLP/nTok:null;
  if(avg===null) confAvailable=false;
  return {text,avgLogprob:avg===null?null:+avg.toFixed(4),
          conf:avg===null?null:+Math.exp(avg).toFixed(4)};
}

/* ============================================================
   STEP 3 — files, matching, run
   ============================================================ */
const FNAME_RE=/^(.+?)[_-]item[_-]?(\d{1,3})(?:[_-]v\d+)?\.[A-Za-z0-9]+$/i;
let FILES=[], MAP=[], RESULTS=[];
const drop=$("drop");
drop.onclick=()=>$("fileIn").click();
drop.ondragover=e=>{e.preventDefault(); drop.classList.add("on");};
drop.ondragleave=()=>drop.classList.remove("on");
drop.ondrop=e=>{e.preventDefault(); drop.classList.remove("on"); takeFiles(e.dataTransfer.files);};
$("fileIn").onchange=e=>takeFiles(e.target.files);

function takeFiles(list){
  FILES=[...list].filter(f=>/\.(wav|mp3|m4a|webm|ogg|flac|aac)$/i.test(f.name));
  FILES.sort((a,b)=>a.name.localeCompare(b.name));
  MAP=FILES.map(f=>{
    const m=f.name.match(FNAME_RE);
    return {file:f, name:f.name, pid:m?m[1]:"", item:m?parseInt(m[2],10):null, auto:!!m};
  });
  if(FILES.length) setDrop("fmtPicked",FILES.length,
      FILES.map(f=>f.name).slice(0,4).join(", "),FILES.length>4);
  else setDrop("dropIdle");
  paintMap();
  updateRunState();
}
function paintMap(){
  if(!MAP.length){ $("mapWrap").classList.add("hidden"); return; }
  $("mapWrap").classList.remove("hidden");
  const bad=MAP.filter(m=>!m.pid||m.item==null).length;
  $("mapSummary").textContent=T("fmtMapSum")(MAP.length-bad,bad);
  $("mapDetails").open = bad>0;
  $("mapRows").innerHTML=MAP.map((m,i)=>
    "<tr"+(!m.pid||m.item==null?" class='unmatched'":"")+">"+
    "<td class='c-it'>"+esc(m.name)+"</td>"+
    "<td><input type='text' data-i='"+i+"' data-k='pid' value='"+esc(m.pid)+"'></td>"+
    "<td><input type='text' data-i='"+i+"' data-k='item' value='"+(m.item==null?"":m.item)+"'></td>"+
    "</tr>").join("");
  $("mapRows").querySelectorAll("input").forEach(inp=>{
    inp.oninput=()=>{
      const i=+inp.getAttribute("data-i"), k=inp.getAttribute("data-k");
      if(k==="pid") MAP[i].pid=inp.value.trim();
      else{ const v=parseInt(inp.value,10); MAP[i].item=isNaN(v)?null:v; }
      const bad2=MAP.filter(m=>!m.pid||m.item==null).length;
      $("mapSummary").textContent=T("fmtMapSum")(MAP.length-bad2,bad2);
      inp.closest("tr").classList.toggle("unmatched",!MAP[i].pid||MAP[i].item==null);
      updateRunState();
    };
  });
}
function updateRunState(){
  const ready=FILES.length>0 && TGT_N>0;
  $("runBtn").disabled=!ready;
  if(!TGT_N) setStatus("stNoTarget");
  else if(!FILES.length) setStatus("stNoAudio");
  else setStatus("stReady");
}

$("runBtn").onclick=async()=>{
  $("runBtn").disabled=true; RESULTS=[]; $("rows").innerHTML=""; $("sumRows").innerHTML="";
  confAvailable=true; $("confWarn").classList.add("hidden");
  const t0=performance.now();
  try{
    await loadModel($("modelSel").value);
    for(let k=0;k<MAP.length;k++){
      const m=MAP[k];
      setStatus("fmtRun",k+1,MAP.length,m.name);
      $("progFill").style.width=(k/MAP.length*100)+"%";
      let r={text:"",avgLogprob:null,conf:null}, dur=null, err=null;
      for(let t=1;t<=2;t++){
        try{
          const {data,dur:d}=await decodeTo16k(m.file); dur=d;
          r=await transcribe(data); err=null; break;
        }catch(e){
          err=String(e&&e.message||e);
          if(t<2){ setStatus("fmtRetry",k+1,MAP.length,m.name); await sleep(800); }
        }
      }
      const target=(m.item!=null&&TARGETS[m.item])?TARGETS[m.item]:"";
      RESULTS.push({file:m.file,name:m.name,pid:m.pid||T("unassigned"),item:m.item,
        target,text:r.text,dur,err,conf:r.conf,avgLogprob:r.avgLogprob,
        sc: target?scorePair(target,r.text):null});
      render();
    }
    $("progFill").style.width="100%";
    setStatus("fmtDone",MAP.length,((performance.now()-t0)/1000).toFixed(1),
      loadedModel.split("/").pop(),hasGPU?"WebGPU":"WASM");
    if(!confAvailable) $("confWarn").classList.remove("hidden");
  }catch(e){ setStatusRaw(T("errPrefix")+(e&&e.message||e)); }
  $("runBtn").disabled=false;
};
$("resetBtn").onclick=()=>{
  FILES=[]; MAP=[]; RESULTS=[];
  $("fileIn").value=""; $("rows").innerHTML=""; $("sumRows").innerHTML="";
  $("resPanel").classList.add("hidden"); $("tabPanel").classList.add("hidden");
  $("mapWrap").classList.add("hidden"); $("confWarn").classList.add("hidden");
  $("progFill").style.width="0%";
  setDrop("dropIdle"); updateRunState();
  window.scrollTo({top:0,behavior:"smooth"});
};

/* ============================================================
   rendering
   ============================================================ */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function diffHtml(sc,text){
  if(!sc||!sc.ops.length) return "<span class='w-om'>"+esc(text||T("noSpeech"))+"</span>";
  return sc.ops.map(o=>{
    const h=o.h.join(" "), r=o.r.join(" ");
    if(o.t==="eq")  return esc(h);
    if(o.t==="sub") return "<span class='w-sub' title='target: "+esc(r)+"'>"+esc(h)+"</span>";
    if(o.t==="ins") return "<span class='w-ins' title='inserted'>"+esc(h)+"</span>";
    return "<span class='w-om' title='omitted: "+esc(r)+"'>▲</span>";
  }).join(" ");
}
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function render(){
  if(!RESULTS.length) return;
  $("resPanel").classList.remove("hidden"); $("tabPanel").classList.remove("hidden");
  const byPid=new Map();
  RESULTS.forEach(r=>{ if(!byPid.has(r.pid)) byPid.set(r.pid,[]); byPid.get(r.pid).push(r); });
  $("sumRows").innerHTML=[...byPid.entries()].map(([pid,rs])=>{
    const sc=rs.filter(r=>r.sc);
    const mAcc=mean(sc.map(r=>r.sc.acc)), mWer=mean(sc.map(r=>r.sc.wer));
    const mConf=mean(rs.filter(r=>r.conf!=null).map(r=>r.conf));
    return "<tr><td class='pid'>"+esc(pid)+"</td>"+
      "<td class='c-n'>"+sc.length+(TGT_N?" / "+TGT_N:"")+"</td>"+
      "<td class='c-n'><span class='acc'>"+(mAcc==null?"—":mAcc.toFixed(1)+"%")+"</span></td>"+
      "<td class='c-n'>"+(mWer==null?"—":mWer.toFixed(3).replace(/^0/,""))+"</td>"+
      "<td class='c-n'>"+(mConf==null?"—":(mConf*100).toFixed(1)+"%")+"</td></tr>";
  }).join("");

  const sort=$("sortSel").value;
  const list=RESULTS.slice();
  if(sort==="acc") list.sort((a,b)=>(a.sc?a.sc.acc:101)-(b.sc?b.sc.acc:101));
  else if(sort==="conf") list.sort((a,b)=>(a.conf==null?9:a.conf)-(b.conf==null?9:b.conf));
  else list.sort((a,b)=> a.pid===b.pid?((a.item||999)-(b.item||999)):a.pid.localeCompare(b.pid));

  $("rows").innerHTML=list.map(r=>{
    const acc=r.sc?r.sc.acc:null, wer=r.sc?r.sc.wer:null;
    const pill=wer==null?"p1":wer===0?"p0":wer>=0.3?"p2":"p1";
    return "<tr>"+
      "<td class='c-pid'>"+esc(r.pid)+"</td>"+
      "<td class='c-it'>"+(r.item!=null?String(r.item).padStart(2,"0"):"—")+"</td>"+
      "<td class='c-tgt'>"+esc(r.sc?r.sc.gt:"")+"</td>"+
      "<td class='c-hyp'><span class='tgt-inline'>"+esc(r.sc?r.sc.gt:"")+"</span>"+
        (r.err?"<span class='errcell'>"+esc(r.err)+"</span>":diffHtml(r.sc,r.text))+"</td>"+
      "<td class='c-n'><span class='acc"+(acc!=null&&acc<50?" low":"")+"'>"+
        (acc==null?"—":acc.toFixed(1)+"%")+"</span></td>"+
      "<td class='c-n'><span class='pill "+pill+"'>"+
        (wer==null?"—":wer.toFixed(3).replace(/^0/,""))+"</span></td>"+
      "<td class='conf'>"+(r.conf==null?"—":"<b>"+(r.conf*100).toFixed(1)+"%</b><br>"+r.avgLogprob)+"</td>"+
      "<td style='text-align:center'><button class='mini' data-f='"+esc(r.name)+"'>&#9654;</button></td></tr>";
  }).join("");
  $("rows").querySelectorAll(".mini").forEach(b=>{
    b.onclick=()=>{ const r=RESULTS.find(x=>x.name===b.getAttribute("data-f"));
      if(r) new Audio(URL.createObjectURL(r.file)).play(); };
  });
  $("foot").textContent=loadedModel||"";
}
$("sortSel").onchange=render;

/* ---------- export ---------- */
function rulesSummary(){
  return "numbers="+(CFG.numbers?"on":"off")+"; contractions="+(CFG.contractions?"on":"off")+
    "; extra="+CFG.rules.map(r=>r.from+">"+r.to).join("|");
}
$("csvBtn").onclick=()=>{
  const cols=["participant","item","target","whisper","wer","accuracy_pct",
              "confidence","avg_logprob","duration_s","file","model","rules"];
  const rows=[cols.join(",")];
  RESULTS.forEach(r=>rows.push([r.pid,r.item??"",r.target,r.text,
    r.sc?r.sc.wer:"",r.sc?r.sc.acc:"",r.conf??"",r.avgLogprob??"",
    r.dur?r.dur.toFixed(2):"",r.name,loadedModel,rulesSummary()].map(v=>{
      v=String(v??""); return (v.includes(",")||v.includes('"'))?'"'+v.replace(/"/g,'""')+'"':v;
    }).join(",")));
  dl(new Blob([rows.join("\n")],{type:"text/csv"}),"eit_scores.csv");
};
$("jsonBtn").onclick=()=>{
  const pids=[...new Set(RESULTS.map(r=>r.pid))];
  dl(new Blob([JSON.stringify({participants:pids,
    meta:{whisper_model:loadedModel,decoding:"greedy (transformers.js, in-browser)",
      confidence:"mean probability of the tokens Whisper selected; avg_logprob is the raw value",
      scoring_rules:{lowercase:true,strip_punctuation:true,keep_possessives:true,
        spell_out_numbers:CFG.numbers,expand_contractions:CFG.contractions,extra_rules:CFG.rules},
      n_target_items:TGT_N, scored_at:new Date().toISOString()},
    items:RESULTS.map(r=>({participant:r.pid,item:r.item,target:r.target,
      transcription_raw:r.text,transcription_corrected:null,
      wer:r.sc?r.sc.wer:null,accuracy_pct:r.sc?r.sc.acc:null,
      confidence:r.conf,avg_logprob:r.avgLogprob,ops:r.sc?r.sc.ops:null,
      duration_s:r.dur?+r.dur.toFixed(2):null,flag:"",file:r.name,reviewed:false}))},null,1)],
    {type:"application/json"}), (pids.length===1?pids[0]:"eit")+"_results.json");
};
function dl(blob,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- restore saved state ---------- */
(function init(){
  let savedCfg=null;
  try{ savedCfg=JSON.parse(localStorage.getItem("eitCfg")||"null"); }catch(e){}
  try{ localStorage.removeItem("eitTargets"); }catch(e){}
  $("optNum").checked = savedCfg ? !!savedCfg.numbers : true;
  $("optContr").checked = savedCfg ? !!savedCfg.contractions : true;
  $("ruleBox").value = savedCfg && savedCfg.rulesText!=null ? savedCfg.rulesText : DEFAULT_RULES;
  CFG.numbers=$("optNum").checked; CFG.contractions=$("optContr").checked;
  CFG.rulesText=$("ruleBox").value; CFG.rules=compileRules(CFG.rulesText);
  applyLang();
  updateRunState();
})();
</script>
