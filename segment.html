<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Segment — EIT Studio</title>
<meta name="description" content="Split a continuous elicited imitation recording into one file per item, in the browser.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="EIT Studio">
<meta property="og:title" content="Segment — EIT Studio">
<meta property="og:description" content="Split a continuous elicited imitation recording into one file per item, in the browser.">
<meta property="og:url" content="https://haeinpark-117.github.io/eit-studio/segment.html">
<meta property="og:image" content="https://haeinpark-117.github.io/eit-studio/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="EIT Studio — administer an elicited imitation task, and score it, in the browser.">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --bg:#f2f2f4; --panel:#fff; --ink:#08080f; --muted:#6a6a7d; --line:#e8e8ef;
    --accent:#3840f3; --accent-dark:#2a31d4; --accent-soft:#eef0ff; --accent-line:#d9dcff;
    --coral:#ff5c35; --ok:#0f9d58;
    --pink:#ff1493; --pink-soft:#fff0f8; --pink-line:#ffcfe8;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); padding:66px 18px 60px;
    font:17.6px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    display:flex; justify-content:center; -webkit-font-smoothing:antialiased}
  .hd{position:fixed; top:0; left:0; right:0; z-index:20; height:50px;
    /* opaque: the page scrolls underneath, and at 92–95 % the text below
       showed through the bar */
    background:#fff; backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); display:flex; align-items:center;
    justify-content:flex-start; gap:14px; padding:0 22px}
  .hd .t{font-weight:800; font-size:18.2px; letter-spacing:-.3px}
  .hd .t a{text-decoration:none; color:inherit}
  .hd .t span{font-weight:400; color:var(--muted); font-size:13.3px; margin-left:9px;
    letter-spacing:.08em; text-transform:uppercase; font-family:var(--mono)}
  .tabs2{display:flex; gap:6px}
  .tabs2 a{font-size:15.2px; font-weight:600; text-decoration:none; color:var(--muted);
    padding:5px 12px; border-radius:8px; border:1px solid transparent; white-space:nowrap}
  .tabs2 a:hover{color:var(--ink); background:#f0f0f5}
  .tabs2 a.on{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent)}
  .hd .rt{display:flex; align-items:center; gap:12px}
  .lang button{font:inherit; font-size:15.2px; padding:4px 11px; border:1px solid var(--line);
    background:#fff; cursor:pointer}
  .lang button:first-child{border-radius:7px 0 0 7px}
  .lang button:last-child{border-radius:0 7px 7px 0; border-left:0}
  .lang button.on{background:var(--accent); color:#fff; border-color:var(--accent)}
  .stage{width:100%; max-width:1180px}

  /* ---- page heading, in the manner of the start page ----------------------
     The tool pages carried a one-word blue title and a grey sentence, which
     read as a label rather than as a statement of what the page does. */
  .hero{padding:16px 4px 24px; border-bottom:1px solid var(--line); margin-bottom:20px}
  .hero .top{display:flex; align-items:baseline; gap:26px; margin:0 0 13px}
  .hero-eye{font-family:var(--mono); font-size:12.4px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--accent); margin:0}
  .hero-t{margin:0; font-size:38px; line-height:1.14; letter-spacing:-1.35px;
    font-weight:800; max-width:900px}
  .hero-t em{font-style:normal; color:var(--accent)}
  .hero-s{margin:15px 0 0; font-size:16px; line-height:1.62; color:var(--muted); max-width:76ch}
  .hero-back{font-size:15.2px; color:var(--accent); text-decoration:none; font-weight:600;
    white-space:nowrap; margin-left:auto; flex:none}
  .hero-back:hover{text-decoration:underline}
  @media(max-width:860px){ .hero-t{font-size:30px; letter-spacing:-1px} }
  @media(max-width:640px){ .hero{padding:12px 2px 20px} .hero-t{font-size:26px; letter-spacing:-.8px} }

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:14px;
    margin-bottom:18px; overflow:hidden}
  .pad{padding:22px 24px}
  .step{display:flex; align-items:center; gap:10px; margin-bottom:6px}
  .step .n{width:22px; height:22px; border-radius:50%; background:var(--accent); color:#fff;
    font-size:14.5px; font-weight:700; display:grid; place-items:center; flex:0 0 auto}
  .step h2{margin:0; font-size:20px; letter-spacing:-.3px}
  .meta{color:var(--muted); font-size:16px; margin:6px 0 14px; line-height:1.65}
  /* ---- boundary-mode chooser ---------------------------------------------
     All three options stay on screen: the choice matters for accuracy, and a
     dropdown hides the two the researcher is not currently looking at. */
  .shead{margin:16px 0 6px; font-weight:700; font-size:16.4px; letter-spacing:-.2px}
  .shead .opt{margin-left:8px; font-family:var(--mono); font-size:11.6px; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
  .basis{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin:18px 0 14px;
    padding:12px 15px; font-size:15.6px; line-height:1.6; color:#2c2c6b;
    background:var(--accent-soft); border:1px solid var(--accent-line);
    border-left:3px solid var(--accent); border-radius:4px 11px 11px 4px}
  details#srcTableWrap summary{cursor:pointer; list-style:none; display:inline-block;
    margin-bottom:6px}
  details#srcTableWrap summary::-webkit-details-marker{display:none}
  .linky{border:0; background:none; padding:0; font-size:14.8px; color:var(--accent);
    text-decoration:underline; cursor:pointer; font-family:inherit}
  .linky:hover{color:var(--accent-dark)}
  .modes{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:6px 0 16px}
  .modes label{position:relative; display:block; cursor:pointer; background:#fff;
    border:1px solid var(--line); border-radius:14px; padding:16px 18px 17px;
    transition:border-color .15s, background .15s, box-shadow .15s}
  .modes label:hover{border-color:var(--accent-line)}
  .modes input{position:absolute; opacity:0; pointer-events:none}
  .modes label:has(input:checked){border-color:var(--accent); background:var(--accent-soft);
    box-shadow:0 0 0 1px var(--accent)}
  .modes label:has(input:focus-visible){box-shadow:0 0 0 3px var(--accent-line)}
  .modes .rk{display:inline-block; font-family:var(--mono); font-size:11.2px; font-weight:700;
    letter-spacing:.11em; text-transform:uppercase; border-radius:999px; padding:3px 9px;
    background:var(--soft); color:var(--muted); margin-bottom:9px}
  .modes label:has(input:checked) .rk{background:var(--accent); color:#fff}
  .modes .mt{display:block; font-weight:700; font-size:16.8px; letter-spacing:-.2px;
    line-height:1.35}
  .modes .md{display:block; margin-top:6px; font-size:14.8px; line-height:1.6;
    color:var(--muted)}
  @media(max-width:820px){ .modes{grid-template-columns:1fr} }
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px}
  label.fl{font-size:15.7px; color:var(--muted)}
  input[type=text],input[type=number],select{font:inherit; font-size:16.4px; padding:7px 10px;
    border:1px solid var(--line); border-radius:8px; background:#fff}
  input[type=number]{width:92px}
  input[type=text]{width:170px}
  button{font:inherit; cursor:pointer}
  .btn-p{background:var(--accent); color:#fff; border:0; border-radius:9px; padding:10px 18px;
    font-weight:650; font-size:16.9px}
  .btn-p:hover{background:var(--accent-dark)}
  .btn-p:disabled{background:#c3c5e8; cursor:default}
  .btn-g{background:#fff; border:1px solid var(--line); border-radius:9px; padding:9px 15px;
    font-size:16.4px; font-weight:600}
  .btn-g:hover{border-color:#c0c0cf}
  .btn-s{padding:6px 11px; font-size:15.2px; border-radius:7px}

  .drop{border:2px dashed var(--accent-line); border-radius:12px; padding:34px 20px;
    text-align:center; color:var(--muted); font-size:16.4px; cursor:pointer;
    background:#fcfcff; transition:.15s}
  .drop:hover,.drop.over{border-color:var(--accent); background:var(--accent-soft)}

  .infobox{background:var(--accent-soft); border-radius:9px; padding:10px 13px; font-size:15.7px;
    color:#3b3e73; line-height:1.65}
  .warn{background:#fff4f0; color:#7a3b28}

  /* ---- the waveform scrolls sideways ---------------------------------------
     Fitting a ten-minute recording into the width of the page left about two
     pixels a second: thirty boundaries landed on top of one another and none of
     them could be grasped. The waveform is now drawn at a readable scale and
     the panel scrolls, with the canvas painting only what is on screen. */
  .wavescroll{overflow-x:auto; overflow-y:hidden; border:1px solid var(--line);
    border-radius:10px; background:#fbfbfd}
  .wavewrap{position:relative; user-select:none; height:190px}
  canvas{display:block; position:sticky; left:0; height:190px}
  /* The waveform stays put while the table scrolls, so a row and the sound it
     refers to can be looked at together. */
  #pEdit{overflow:visible}
  .wavedock{position:sticky; top:50px; z-index:6; background:var(--panel);
    margin:0 -24px; padding:10px 24px 8px}
  .wavedock.stuck{border-bottom:1px solid var(--line);
    box-shadow:0 8px 16px -12px rgba(20,20,60,.45)}
  .dockhint{margin:0 0 0 auto; font-family:var(--mono); font-size:12.8px}
  .zoombar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 8px}
  .zoombar .zk{font-family:var(--mono); font-size:11.6px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted); margin-right:2px}
  .zoombar button.on{background:var(--accent); border-color:var(--accent); color:#fff}

  /* ---- controls in the segment table ---- */
  .fileline{display:flex; align-items:center}
  .play{background:none; border:1px solid var(--line); border-radius:6px; width:26px; height:26px;
    cursor:pointer; color:var(--accent); font-size:11px; padding:0; margin-right:9px; flex:none}
  .play:hover{border-color:var(--accent-line); background:var(--accent-soft)}
  .nudge{display:inline-flex; align-items:center; gap:2px}
  .nudge button{background:#fff; border:1px solid var(--line); border-radius:5px; width:22px;
    height:22px; cursor:pointer; color:var(--accent); font-size:12px; padding:0; line-height:1}
  .nudge button:hover{background:var(--accent-soft); border-color:var(--accent-line)}
  .nudge .v{min-width:6.5ch; text-align:right; font-variant-numeric:tabular-nums}
  .marks{position:absolute; inset:0; pointer-events:none}
  .seg{position:absolute; top:0; bottom:22px; background:rgba(56,64,243,.07);
    border-left:2px solid var(--accent); border-right:2px solid var(--accent);
    pointer-events:auto; cursor:grab; z-index:1}
  .seg:hover{background:rgba(56,64,243,.13)}
  .seg.on{background:rgba(56,64,243,.18); cursor:grabbing}
  /* the row picked in the table and the stretch it refers to are marked together */
  .seg.focus{background:rgba(255,20,147,.14); border-left-color:var(--pink);
    border-right-color:var(--pink)}
  .seg.focus .lab{background:var(--pink)}
  table.segs tr.focus td{background:var(--pink-soft)}
  .seg .lab{position:absolute; top:4px; left:4px; font-family:var(--mono); font-size:12.1px;
    color:#fff; background:var(--accent); border-radius:4px; padding:1px 5px;
    pointer-events:none}
  .hnd{position:absolute; top:0; bottom:22px; width:15px; margin-left:-7px; cursor:col-resize;
    pointer-events:auto; z-index:3}
  .hnd::after{content:""; position:absolute; left:6px; top:0; bottom:0; width:3px;
    background:var(--accent); border-radius:2px}
  .hnd:hover::after,.hnd.on::after{left:5px; width:5px; background:var(--accent-dark)}
  .dragtip{position:absolute; bottom:28px; transform:translateX(-50%); z-index:6;
    font-family:var(--mono); font-size:12.1px; color:#fff; background:var(--accent-dark);
    border-radius:4px; padding:2px 7px; white-space:nowrap; pointer-events:none}
  .ruler{position:absolute; left:0; right:0; bottom:0; height:22px; border-top:1px solid var(--line);
    background:#fff; overflow:hidden}
  .tick{position:absolute; bottom:2px; padding-left:5px; font-family:var(--mono); font-size:11.6px;
    color:var(--muted); white-space:nowrap}
  .tick i{position:absolute; left:0; bottom:13px; width:1px; height:5px; background:var(--line);
    display:block}
  .cursor{position:absolute; top:0; bottom:22px; width:1px; background:var(--coral)}
  .skip{position:absolute; left:0; top:0; bottom:22px; background:rgba(255,92,53,.10);
    border-right:2px solid var(--coral)}
  .skip .lab{position:absolute; top:4px; right:5px; font-family:var(--mono); font-size:12.1px;
    color:#fff; background:var(--coral); border-radius:4px; padding:1px 5px; white-space:nowrap}
  .skiphnd{position:absolute; top:0; bottom:22px; width:11px; margin-left:-5px;
    cursor:col-resize; pointer-events:auto}
  .skiphnd::after{content:""; position:absolute; left:4px; top:0; bottom:0; width:3px;
    background:var(--coral); border-radius:2px}

  table.segs{width:100%; border-collapse:collapse; font-size:15.7px; margin-top:14px}
  table.segs th{text-align:left; font-family:var(--mono); font-size:12.1px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted); font-weight:600; padding:9px 10px;
    border-bottom:1px solid var(--line)}
  table.segs td{padding:8px 10px; border-bottom:1px solid #f2f2f6; font-family:var(--mono);
    font-size:15.2px}
  table.segs tr:last-child td{border-bottom:0}
  table.segs tr.short td{background:#fff4f0}
  table.segs .nm{font-family:var(--mono); color:var(--accent)}
  .iconbtn{border:1px solid var(--line); background:#fff; border-radius:6px; padding:4px 11px;
    font-size:14.5px; line-height:1.2}
  .iconbtn:hover{border-color:var(--coral); color:var(--coral)}
  .chip{display:inline-block; font-family:var(--mono); font-size:12.8px; padding:2px 8px;
    border-radius:999px; letter-spacing:.04em}
  .chip.ok{background:#e8f5ec; color:#186a3b}
  .chip.mid{background:#fff4e5; color:#8a5a00}
  .chip.low{background:#fff0ec; color:#a2381c}
  .hidden{display:none}
  .foot{font-size:14px; color:var(--muted); padding:11px 22px; border-top:1px solid var(--line);
    background:#fafafb; font-family:var(--mono)}
  /* ---------- read-me-first guide ---------- */
  .panel.gpanel{background:var(--accent-soft); border-color:var(--accent-line)}
  .panel.gpanel .pad{padding:18px 22px}
  #guide summary{cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px;
    flex-wrap:wrap}
  #guide summary::-webkit-details-marker{display:none}
  #guide .chev{color:var(--accent); font-size:23px; line-height:1; transition:transform .15s;
    display:inline-block; font-weight:700}
  #guide[open] .chev{transform:rotate(90deg)}
  #guide .badge-read{font-family:var(--mono); font-size:12.1px; letter-spacing:.12em;
    text-transform:uppercase; background:var(--accent); color:#fff; border-radius:999px;
    padding:4px 10px; white-space:nowrap}
  #guide .gtitle{font-weight:700; font-size:18.8px; letter-spacing:-.2px; color:var(--ink)}
  #guide summary:hover .gtitle{color:var(--accent-dark)}
  #guide .gbody{margin:14px 0 0; padding-top:14px; border-top:1px solid var(--accent-line)}
  #guide .gbody b{color:var(--ink)}

  .bar{flex:1; height:6px; background:#e9e9f0; border-radius:4px; overflow:hidden; min-width:120px}
  .bar i{display:block; height:100%; width:0; background:var(--accent); transition:width .2s}
  @media(max-width:700px){ table.segs .endc{display:none} }
  /* the target sentence is prose, so it is set in the body face rather than the
     mono face the timings use */
  table.segs .tgtcol{width:32%}
  /* on a narrow screen the sentence would wrap to one word a line, so the
     column steps aside before the timings do */
  @media(max-width:820px){ table.segs .tgtcol{display:none} }
  table.segs td.tgtcol{font:15.6px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,
    Roboto,sans-serif; color:var(--ink)}

  /* ---- links out to the documentation ---------------------------------------
     The tool pages used to link only to one another, so a question that came up
     mid-run ("what does the normalizer do", "how do I cite this") had no exit. */
  .hsep{width:1px; height:22px; background:var(--line); margin-left:auto; flex:none}
  .docs2{display:flex; gap:19px; font-size:14.6px; white-space:nowrap}
  .docs2 a{text-decoration:none; color:var(--muted)}
  .docs2 a:hover{color:var(--ink)}

  /* ---- narrow screens: the tool header becomes two rows -------------------
     Four tabs plus the language switch do not fit one 50 px row on a phone,
     and the overflow put the Segment tab and the switch out of reach. */
  @media(max-width:760px){
    body,body.running{padding-top:175px}
    .hd{height:auto; flex-wrap:wrap; padding:9px 14px 0; align-items:center}
    .hd .t{font-size:16.9px}
    .hd .t span{display:none}
    .hd .rt{margin-left:auto; gap:8px}
    .lang button{font-size:14px; padding:4px 9px}
    .tabs2{order:3; width:100%; margin:9px -14px 0; padding:0 14px 9px;
      gap:5px; overflow-x:auto; -webkit-overflow-scrolling:touch;
      scrollbar-width:none; -ms-overflow-style:none}
    .tabs2::-webkit-scrollbar{display:none}
    .tabs2 a{font-size:14.5px; padding:5px 10px; flex:0 0 auto}
  }
  /* on a narrow screen the documentation links drop to their own row, so the
     body has to clear a taller fixed header */
  @media(max-width:1100px){
    .hsep{display:none}
    .docs2{order:4; width:100%; margin:0 -14px; padding:8px 14px 9px;
      border-top:1px solid var(--line); gap:16px; font-size:14px;
      overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none}
    .docs2::-webkit-scrollbar{display:none}
    .hd{height:auto; flex-wrap:wrap; padding:9px 14px 0; align-items:center}
  }
  @media(max-width:1100px) and (min-width:761px){ body,body.running{padding-top:117px} }
  @media(max-width:760px){ body,body.running{padding-top:175px} }
</style>
</head>
<body>

<div class="hd">
  <div class="t"><a href="index.html">EIT&nbsp;Studio</a></div>
  <div class="tabs2">
    <a href="start.html" data-i18n="tabStart"></a>
    <a href="administer.html" data-i18n="tabAdm"></a>
    <a href="app.html" data-i18n="tabScore"></a>
    <a href="segment.html" class="on" data-i18n="tabSeg"></a>
  </div>
  <span class="hsep"></span>
  <div class="docs2">
    <a href="how.html">How it works</a>
    <a href="asr.html">Speech recognition</a>
    <a href="cite.html">How to cite</a>
    <a href="about.html">About</a>
  </div>
</div>

<div class="stage">
  <div class="hero">
    <div class="top">
      <p class="hero-eye" data-i18n="heroEye"></p>
      <a class="hero-back" href="app.html" data-i18n="heroBack"></a>
    </div>
    <h1 class="hero-t"><span data-i18n="heroT"></span> <em data-i18n="heroT2"></em></h1>
    <p class="hero-s" data-i18n="heroSub"></p>
  </div>

  <div class="panel gpanel"><div class="pad">
    <details id="guide">
      <summary>
        <span class="chev" aria-hidden="true">›</span>
        <span class="badge-read" data-i18n="guideBadge"></span>
        <span class="gtitle" data-i18n="guideTitle"></span>
      </summary>
      <div class="meta gbody">
        <p style="margin:0 0 10px" data-i18n="guideIntro"></p>
        <ul style="margin:0 0 12px; padding-left:20px; line-height:1.75">
          <li data-i18n="guideA"></li>
          <li data-i18n="guideB"></li>
          <li data-i18n="guideC"></li>
          <li data-i18n="guideD"></li>
        </ul>
        <p style="margin:0 0 10px" data-i18n="guideWorst"></p>
        <p style="margin:0 0 10px" data-i18n="guideNaming"></p>
        <p style="margin:0" data-i18n="guideSpeed"></p>
      </div>
    </details>
  </div></div>

  <!-- 1 : file -->
  <div class="panel"><div class="pad">
    <div class="step"><span class="n">1</span><h2 data-i18n="s1Title"></h2></div>
    <p class="meta" data-i18n="s1Help"></p>
    <div class="row">
      <label for="pid" class="fl" data-i18n="lblPid"></label>
      <input type="text" id="pid" placeholder="P01">
      <label for="expected" class="fl" data-i18n="lblCount"></label>
      <input type="number" id="expected" min="1" max="200" value="30">
      <label for="startNo" class="fl" data-i18n="lblStart"></label>
      <input type="number" id="startNo" min="1" max="200" value="1">
    </div>
    <div class="drop" id="drop" role="button" tabindex="0" aria-label="Choose one recording to split"><span id="dropMsg"></span>
      <input type="file" id="fileIn" accept="audio/*" style="display:none">
    </div>
  </div></div>

  <!-- 2 : detect -->
  <div class="panel hidden" id="pDetect"><div class="pad">
    <div class="step"><span class="n">2</span><h2 data-i18n="s2Title"></h2></div>
    <p class="meta" data-i18n="s2Help"></p>

function ac(){ if(!CTX) CTX=new (window.AudioContext||window.webkitAudioContext)(); return CTX; }
function setDrop(k,...a){ DROPK={k,a}; paintDrop(); }
function paintDrop(){
  const v=T(DROPK.k);
  $("dropMsg").textContent = typeof v==="function" ? v(...DROPK.a) : v;
}
function setDetect(k,...a){ DETK={k,a}; paintDetect(); }
function paintDetect(){
  if(!DETK){ $("detectInfo").textContent=""; return; }
  const v=T(DETK.k);
  $("detectInfo").textContent = typeof v==="function" ? v(...DETK.a) : v;

/* ---------- file input ---------- */
const drop=$("drop");
drop.onclick=()=>$("fileIn").click();
/* the drop zone is a control, so it answers to the keyboard as well */
drop.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); $("fileIn").click(); } };
drop.ondragover=e=>{ e.preventDefault(); drop.classList.add("over"); };

async function load(f){
  NAME=f.name;
  setDrop("__raw", f.name);
  $("dropMsg").textContent=f.name;
  try{
    const ab=await f.arrayBuffer();
    BUF=await ac().decodeAudioData(ab);
  }catch(err){ setDrop("errDecode"); return; }
  setDrop("fmtLoaded", f.name, BUF.duration);
  /* A short recording still fits; a long one opens at a scale where the
     boundaries are far enough apart to be grasped, and scrolls. */
  ZOOM = BUF.duration>75 ? "60" : "fit";
  buildEnvelope();
  $("pDetect").classList.remove("hidden");
  $("pEdit").classList.remove("hidden");
  $("pExport").classList.remove("hidden");
  detect();
  autoFit();
}

/* ---------- RMS envelope ---------- */
function buildEnvelope(){
  const sr=BUF.sampleRate, ch=BUF.numberOfChannels;
  const hop=Math.max(1,Math.round(sr*HOP));
  const n=Math.floor(BUF.length/hop);
  const data=[];
  for(let c=0;c<ch;c++) data.push(BUF.getChannelData(c));
  const env=new Float32Array(n);
  for(let i=0;i<n;i++){
    let sum=0;
    const s=i*hop, e=Math.min(BUF.length,s+hop);
    for(let j=s;j<e;j++){
      let v=0; for(let c=0;c<ch;c++) v+=data[c][j];
      v/=ch; sum+=v*v;
    }
    env[i]=Math.sqrt(sum/Math.max(1,e-s));
  }
  ENV=env;
}
/* noise floor = low percentile of the envelope */
function floorLevel(){
  const a=Float32Array.from(ENV); a.sort();
  return a[Math.floor(a.length*0.15)];
}
function peakLevel(){
  const a=Float32Array.from(ENV); a.sort();
  return a[Math.floor(a.length*0.98)];
}

/* ---------- segmentation ---------- */
function segment(minSil,minLen,padS,thrMul,opts){
  const fl=floorLevel(), pk=peakLevel();
  const thr=Math.max(fl*thrMul, fl+(pk-fl)*0.06);
  const silFrames=Math.round(minSil/HOP);
  const maxLen=(opts&&opts.maxLen!=null)?opts.maxLen:(+$("maxLen").value||1e9);
  const skip=(opts&&opts.from!=null)?opts.from:(+$("skipS").value||0);
  const from=Math.max(0,Math.round(skip/HOP));
  const out=[]; let start=-1, quiet=0;
  for(let i=from;i<ENV.length;i++){
    if(ENV[i]>thr){
      if(start<0) start=i;
      quiet=0;
    }else if(start>=0){
      quiet++;
      if(quiet>=silFrames){
        const end=i-quiet;
        const L=(end-start)*HOP;
        if(L>=minLen&&L<=maxLen) out.push([start,end]);
        start=-1; quiet=0;
      }
    }
  }
  if(start>=0){
    const L=(ENV.length-start)*HOP;
    if(L>=minLen&&L<=maxLen) out.push([start,ENV.length-1]);
  }
  const dur=BUF.duration;
  const lo=skip;
  return out.map(([a,b])=>({
    s:Math.max(lo,a*HOP-padS),

function detect(thrMul){

  const exp=+$("expected").value;
  if(!SEGS.length) setDetect("errNoSeg");

  else setDetect("fmtFound",SEGS.length,exp);

}
/* search silence length and threshold for the expected count */
/* Recordings usually open with the researcher's instructions and often with
   practice items, and may end with a stray remark. Rather than assuming the task
   is the last N segments, choose the run of N consecutive segments whose spacing
   is most regular: a fixed-schedule task produces evenly spaced responses,
   whereas a preamble is separated from them by an unusually long gap. The result
   is an estimate the user is asked to confirm by ear. */
function gapStats(list){
  /* Two views of spacing. Gaps between segments show whether a stretch is
     missing; intervals between onsets show whether the cadence is regular,
     which is what a fixed-schedule task produces. A window that has split one
     response into two has a very irregular onset cadence even though its gaps
     are small, so the onset view is what the search is scored on. */
  const g=[],d=[];
  for(let j=1;j<list.length;j++){
    g.push(Math.max(0,list[j].s-list[j-1].e));
    d.push(list[j].s-list[j-1].s);
  }
  if(!g.length) return {max:0,med:0,cv:0};
  const srt=g.slice().sort((a,b)=>a-b);
  const mean=d.reduce((a,b)=>a+b,0)/d.length;
  const sd=Math.sqrt(d.reduce((a,b)=>a+(b-mean)*(b-mean),0)/d.length);
  return {max:Math.max.apply(null,g), med:srt[Math.floor(srt.length/2)],

}
/* Regularity alone is the wrong test for an elicited imitation task. The
   response window grows with the length of the sentence, so the true cadence is
   deliberately uneven — it runs from about nine seconds at the short items to
   nearly twenty at the long ones — while a window that has split several early
   responses into fragments looks far more regular than the real thing. Left at
   that, the search settles on a stretch of fragments near the front and abandons
   the rest of the recording.

   Speech left after the last chosen response is therefore counted as well. A
   session may open with instructions and practice items, so a long preamble is
   expected and costs nothing; it does not usually close with several minutes of
   talk, so responses left stranded at the end are evidence that the wrong
   stretch was chosen. */
const TAIL_COST=0.02;

    const after=list.length-i-exp;

function pickWindow(){

  SEGS=best.win;

  $("skipS").value=t.toFixed(1);
  drawMarks(); renderTable();
  return t;
}
/* Flag spacing that does not look like a fixed-schedule task. */
function spacingWarning(){

function autoFit(){
  const exp=+$("expected").value, padS=+$("pad").value;
  /* Search the detection settings, but do not stop at the first combination that
     happens to yield the expected count: a fixed-schedule task produces evenly
     spaced responses, so prefer the candidate whose spacing is most regular. */
  let best=null, fallback=null;
  /* Long pauses inside one response are common — a participant restarts, or
     thinks mid-sentence — so the search has to reach silences of a few seconds
     before it will treat the pieces as one answer. */
  for(const sil of [0.4,0.5,0.6,0.7,0.8,1.0,1.2,1.5,2.0,2.5,3.0]){
    for(const ml of [0.8,0.5,0.3,1.2]){
      for(const mul of [2,2.5,3,4,5,6,8]){
        const segs=segment(sil,ml,padS,mul);
        if(segs.length>=exp){
          const w=bestWindow(segs,exp);
          if(w&&(!best||w.score<best.score)) best={score:w.score,sil,ml,mul,segs:w.win};
        }else{
          const d=exp-segs.length;
          if(!fallback||d<fallback.d) fallback={d,sil,ml,mul,segs};
        }
      }
    }
  }
  if(!best&&!fallback){ setDetect("errNoSeg"); return; }
  const pick=best||fallback;
  $("minSil").value=pick.sil; $("minLen").value=pick.ml;
  SEGS=pick.segs;
  if(best&&SEGS.length){
    const t=Math.max(0,SEGS[0].s-0.5);
    $("skipS").value=t.toFixed(1);
  }
  draw(); renderTable();
  if(SEGS.length!==exp){ setDetect("fitFail"); return; }

     worth saying plainly when a stretch of the recording has been left out: on a
     fixed schedule that is a sign the wrong stretch was chosen, and a timing
     grid will place the items where silence detection cannot. */
  const end=SEGS[SEGS.length-1].e;
  const rest=segment(0.5,0.4,0,3,{from:0,maxLen:1e9}).filter(x=>x.s>end+0.5);

/* ============================================================
   Timing-grid modes
   An EIT is administered on a fixed schedule: for each item the stimulus is
   played, a fixed pause follows, a tone marks the start of the response window,
   and the window itself lasts stimulus + base + per-syllable time. Knowing that
   schedule, every item boundary follows from a single start time — including
   items where the participant said nothing, which silence detection can never
   recover.
   ============================================================ */
let STIM=[];        /* measured stimulus durations, seconds  */
let TGT=[];         /* [item, sentence, syllables]           */
let TARGETS=[];     /* the same list, kept for the table     */
let GRIDINFO=null;

function constants(){
  return {pause:+$("cPause").value, tone:+$("cTone").value,
          base:+$("cBase").value, per:+$("cPer").value, thr:+$("cThr").value};
}
/* cycle[i] = stimulus + pause + tone + window,  window = stimulus + base + per*(syl-thr) */
function buildCycles(stims,syls){
  const c=constants(), out=[];
  for(let i=0;i<stims.length;i++){
    const win=Math.max(0.5, stims[i]+c.base+c.per*((syls[i]||c.thr)-c.thr));
    out.push({stim:stims[i], win, lead:stims[i]+c.pause+c.tone,
              cycle:stims[i]+c.pause+c.tone+win});
  }
  return out;
}
/* Response-window start/end for every item, given a start time. */
function gridAt(cyc,t0,rate){
  const out=[]; let t=t0;
  for(const k of cyc){
    const lead=k.lead*(rate||1), win=k.win*(rate||1);
    out.push({s:t+lead, e:t+lead+win});
    t+=lead+win;
  }
  return out;
}
/* Detected speech onsets, used only to anchor the grid. */
/* Onsets are used only to anchor the grid, so they must be read from the whole
   file: the “ignore before” and maximum-length filters belong to the silence
   mode and would otherwise hide the very responses the fit needs. */
function onsets(){
  return segment(0.5,0.4,0,3,{from:0,maxLen:1e9}).map(x=>({s:x.s,e:x.e}));
}
/* Anchor the schedule on the responses that were actually detected.

   The earlier version slid the whole schedule forward from the start of the
   recording and required it to fit inside what was left, which fails on a real
   session: a recording that opens with instructions and practice items leaves
   the true start well beyond the range that search could reach, and a score
   that only counted onsets falling inside a window could be satisfied by an
   alignment displaced by a whole item.

   The schedule is instead mapped onto the detected onsets by a start time and a
   single tempo factor. A candidate is scored by how many items find an onset of
   their own: one onset may serve only one item and the order must be kept, so a
   fit displaced by one item cannot borrow its neighbour's response, and the
   uneven spacing of the schedule — the cycle grows with the syllable count —
   tells the two apart. */
function firstAfter(obs,t){
  let lo=0,hi=obs.length;
  while(lo<hi){ const m=(lo+hi)>>1; if(obs[m].s<t) lo=m+1; else hi=m; }
  return lo;
}
/* A response begins at or just after the window opens, never long before it. */
const ANCH_EARLY=0.75, ANCH_LATE=2.5;
function scoreAnchor(x,win,obs,t0,rate,pen){
  let hits=0,err=0,used=-1;
  for(let i=0;i<x.length;i++){
    const p=t0+rate*x[i];
    let j=firstAfter(obs,p-ANCH_EARLY);
    if(j<=used) j=used+1;
    if(j<obs.length && obs[j].s<=p+Math.min(ANCH_LATE,rate*win[i])){
      hits++; err+=Math.abs(obs[j].s-p); used=j;
    }
  }
  const mean=hits?err/hits:0;
  return {hit:hits, err:mean, score:hits-Math.abs(mean)/12-Math.abs(rate-1)*(pen||1.5)};
}
function fitGrid(cyc,fitRate,measured){
  const obs=onsets().sort((a,b)=>a.s-b.s);
  if(!obs.length) return null;
  /* nominal start of each response window, measured from the start of item 1 */
  const x=[],win=[]; let t=0;
  for(const k of cyc){ x.push(t+k.lead); win.push(k.win); t+=k.lead+k.win; }
  const last=x[x.length-1], dur=BUF.duration;
  /* Only the last window's start has to fall inside the recording; a response
     cut off at the very end is common and must not rule the alignment out. */
  /* a measured schedule came from the very audio that was played, so the tempo
     is not in question; only the moment the participant's recorder started is */
  const lo=measured?0.99:(fitRate?0.75:0.82), hi=measured?1.01:(fitRate?1.35:1.22);
  const step=measured?0.002:0.01, pen=measured?8:1.5;
  let best=null;
  for(let rate=lo; rate<=hi+1e-9; rate=+(rate+step).toFixed(4)){
    const t0max=dur-rate*last;
    if(t0max<0) continue;
    for(let t0=0; t0<=t0max+1e-9; t0+=0.1){
      const r=scoreAnchor(x,win,obs,t0,rate,pen);
      if(!best||r.score>best.score) best={...r,t0,rate};
    }

  if(!best) return null;
  let fine=best;
  const fs=measured?0.001:0.005, fr=measured?0.004:0.02;
  for(let dr=-fr; dr<=fr+1e-9; dr=+(dr+fs).toFixed(4)){
    const rate=+(best.rate+dr).toFixed(4);
    if(rate<=0) continue;
    const t0max=dur-rate*last;
    for(let t0=Math.max(0,best.t0-0.6); t0<=Math.min(t0max,best.t0+0.6); t0+=0.02){
      const r=scoreAnchor(x,win,obs,t0,rate,pen);
      if(r.score>fine.score) fine={...r,t0,rate};

function applyGrid(){
  const exp=+$("expected").value, mode=$("mode").value;
  let stims=null, syls=null, estimated=false;

     none of it has to be inferred: no sentence list, no syllable counts, no
     constants. */
  if(mode==="source"){
    if(!SRCCYC){ setDetect("gridNeedSrc"); return; }
    if(SRCCYC.length!==exp){ setDetect("fmtGridCount",SRCCYC.length,exp); return; }
    placeGrid(SRCCYC,false,true);
    return;
  }
  /* Both grid modes need the syllable counts, because they set the length of
     the response window. Stimulus audio, when supplied, additionally gives the
     exact playback duration instead of an estimate. */
  TGT=parseTargetLines($("tgtBox").value);
  if(!TGT.length||TGT.some(t=>!t[2])){ setDetect("gridNeedText"); return; }
  syls=TGT.map(t=>t[2]);
  /* the stimulus recordings are an optional refinement of the same mode: when
     they are there their measured lengths replace the syllable estimate, and
     when they are not the estimate stands */
  if(STIM.length && STIM.length===TGT.length){
    stims=STIM.slice();
  }else{
    /* stimulus duration is not knowable from text; estimate it from syllables
       and let the fit rescale it to this recording */
    stims=syls.map(v=>0.726+0.204*v);
    estimated=true;
  }
  if(stims.length!==exp){ setDetect("fmtGridCount",stims.length,exp); return; }
  placeGrid(buildCycles(stims,syls),estimated,false);

function placeGrid(cyc,estimated,measured){
  const exp=cyc.length;
  const tones=findTones(+$("cToneHz").value||1000);
  let g=null, viaTone=false, fit=null;
  if(tones.length>=exp){
    /* Take the run of beeps whose spacing best matches the schedule. */
    let best=null;
    for(let i=0;i+exp<=tones.length;i++){
      const t=tones.slice(i,i+exp);
      let e=0;
      for(let j=1;j<exp;j++) e+=Math.abs((t[j].s-t[j-1].s)-(cyc[j-1].win+cyc[j].lead));
      if(!best||e<best.e) best={e,t};
    }
    if(best&&best.e/exp<1.5){
      g=best.t.map((t,i)=>({s:t.e, e:t.e+cyc[i].win}));
      viaTone=true;
    }
  }
  if(!g){
    fit=fitGrid(cyc,estimated,measured);
    if(!fit){ setDetect("errNoSeg"); return; }
    g=gridAt(cyc,fit.t0,fit.rate);
  }
  const padS=+$("pad").value;
  const errs=[];
  /* Trim each window to the speech inside it. Scanning the envelope directly —
     rather than reusing the merged runs — matters when the beep and the response
     are close together, because a merged run would start at the beep. */
  const fl=floorLevel(), pk=peakLevel();
  const thr=Math.max(fl*3, fl+(pk-fl)*0.06);
  const voiced=t=>{ const i=Math.round(t/HOP); return i>=0&&i<ENV.length&&ENV[i]>thr; };
  SEGS=g.map(w=>{
    const lo=Math.max(0,w.s), hi=Math.min(BUF.duration,w.e);
    let a=null,b=null,n=0;
    for(let t=lo;t<hi;t+=HOP){ if(voiced(t)){ if(a===null) a=t; b=t; n++; } }
    /* a few stray frames are bleed from the beep or the previous response, not a
       response: require at least 150 ms of voiced signal */
    if(a===null||n*HOP<0.15) return {s:lo,e:hi,empty:true,off:null};
    errs.push(a-w.s);
    return {s:Math.max(lo,a-padS), e:Math.min(hi,b+padS), empty:false, off:a-w.s};
  });

  drawMarks(); renderTable();
  /* How long a participant takes to begin is not a fault in the alignment, so
     the warning is raised on the spread of those delays rather than on the
     largest one: a grid that drifts makes them creep, whereas a slow speaker
     merely makes them all larger. */
  const srt=errs.slice().sort((a,b)=>a-b);
  const q=p=>srt.length?srt[Math.min(srt.length-1,Math.floor(srt.length*p))]:0;
  const spread=srt.length?q(0.9)-q(0.1):0;
  const rms=errs.length?Math.sqrt(errs.reduce((a,b)=>a+b*b,0)/errs.length):0;
  if(viaTone) setDetect("fmtGridTone",SEGS.length,rms);
  else if(spread>3) setDetect("fmtGridDrift",SEGS.length,spread);
  else if(measured) setDetect("fmtSrcPlaced",SEGS.length,rms,
    SEGS.filter(x=>x.empty).length);

  else setDetect("fmtGridOk",SEGS.length,rms);
}
/* Minimal target-set parser: number, sentence, syllables — or sentence, syllables. */
function csvSplit(line){
  const out=[]; let cur="", q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(q){
      if(c==='"' && line[i+1]==='"'){ cur+='"'; i++; }
      else if(c==='"') q=false;
      else cur+=c;
    }else{
      if(c==='"') q=true;
      else if(c===","){ out.push(cur.trim()); cur=""; }
      else cur+=c;
    }
  }
  out.push(cur.trim());
  return out;
}
function parseTargetLines(text){
  const out=[]; let auto=0;
  String(text||"").split(/\r?\n/).forEach(line=>{
    const raw=line.trim(); if(!raw) return;
    /* A sheet saved as CSV quotes any sentence that contains a comma, so the
       line has to be split with the quoting rules rather than on every comma. */
    const cells=raw.indexOf("\t")>=0 ? raw.split("\t").map(c=>c.trim()) : csvSplit(raw);
    if(cells.length>=2&&/^(item|number|no|num|sentence|번호)$/i.test(cells[0])) return;   /* header */
    if(cells.length>=3&&/^\d+$/.test(cells[0])&&/^\d+$/.test(cells[cells.length-1]))
      out.push([parseInt(cells[0],10),cells.slice(1,-1).join(","),parseInt(cells[cells.length-1],10)]);
    else if(cells.length>=2&&/^\d+$/.test(cells[cells.length-1])&&!/^\d+$/.test(cells[0]))
      out.push([++auto,cells.slice(0,-1).join(","),parseInt(cells[cells.length-1],10)]);
  });
  return out;
}

   The recording that was played
   Given the audio the participants heard, nothing about the schedule has to be
   assumed. Each sentence's playback length, the tone that opens the response
   window and the length of the window itself are all read off that one file, so
   the syllable-count estimate — the largest remaining source of error — drops

let SRCCYC=null, SRCINFO=null;
function setSrc(k,...a){ SRCK={k,a}; paintSrc(); }
let SRCK=null;
function paintSrc(){

const srcDrop=$("srcDrop");
srcDrop.onclick=()=>$("srcIn").click();
srcDrop.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); $("srcIn").click(); } };

async function loadSource(file){
  const exp=+$("expected").value;
  if(!exp){ setSrc("srcNeedCount"); return; }
  let bf;
  try{
    const ab=await file.arrayBuffer();
    bf=await ac().decodeAudioData(ab);
  }catch(e){ setSrc("errDecode"); return; }
  /* the analysis reads the working buffer, so it is lent to the source file and
     handed straight back */
  const keepB=BUF, keepE=ENV;
  BUF=bf; buildEnvelope();
  let tones=[], runs=[];
  try{
    tones=findTones(+$("cToneHz").value||1000);
    runs=segment(0.35,0.15,0,3,{from:0,maxLen:1e9});
  }finally{ BUF=keepB; ENV=keepE; }
  buildSchedule(file.name,bf.duration,tones,runs,exp);

/* Group speech runs into utterances, then keep the last n. On a stimulus track
   the silence between items is several seconds — the response window — while the
   pauses inside one sentence are a fraction of a second, so a one-and-a-half
   second gap separates items cleanly. Taking the last n rather than splitting the
   whole file into n keeps instructions and practice items out of the count. */
function splitInto(runs,n){
  if(!runs.length) return null;
  const g=[{s:runs[0].s,e:runs[0].e}];
  for(let j=1;j<runs.length;j++){
    const last=g[g.length-1];
    if(runs[j].s-last.e<1.5) last.e=runs[j].e;
    else g.push({s:runs[j].s,e:runs[j].e});
  }
  /* a quarter-second blip is a signal tone or a click, not a sentence */
  const u=g.filter(x=>x.e-x.s>=0.5);
  return u.length>=n ? u.slice(u.length-n) : null;

function buildSchedule(name,dur,tones,runs,exp){

  const speech=[];
  runs.forEach(r=>{
    if(isTone(r)) return;
    const last=speech[speech.length-1];
    if(last&&r.s-last.e<0.4) last.e=r.e; else speech.push({s:r.s,e:r.e});
  });

  if(tones.length<exp){
    /* Without a tone the moment the window opens cannot be read off the file,
       but the stimulus lengths still can, and those are the part the other
       modes have to guess at. They are handed to the timing-grid mode. */
    const cl=splitInto(speech,exp);
    $("srcTableWrap").classList.add("hidden");
    if(cl){ STIM=cl.map(c=>c.e-c.s); paintStimMsg();
      setSrc(tones.length?"fmtSrcFewStim":"fmtSrcNoToneStim",tones.length,exp); }
    else setSrc(tones.length?"fmtSrcFew":"srcNoTone",tones.length,exp);
    return;
  }
  /* practice items come first, so the task is the last run of tones */
  const task=tones.slice(tones.length-exp);
  const items=task.map((t,i)=>({
    tone:t, ws:t.e,
    we:(i<exp-1) ? (speech.find(r=>r.s>t.e+0.05)||{s:null}).s : null
  }));
  /* One item's cycle ends where the next stimulus begins, and that is the first
     speech after the tone — a quantity the detector gets right. The start of the
     stimulus itself is not: a sentence often registers as two or three runs with
     a pause between them, and taking the last of those would shorten the cycle
     and make the whole schedule creep. So each cycle is closed on the following
     item's start rather than on its own detected stimulus, and the stimulus is
     read as everything audible between the two. */
  /* Item 1 has no preceding item to close on, and whatever came before it —
     instructions, practice — is not part of its cycle, so its stimulus is read
     backwards from the tone for as long as the speech stays contiguous. */
  const backTo=t=>{
    const before=speech.filter(r=>r.e<=t.s+0.05);
    if(!before.length) return null;
    let a=before.length-1;
    while(a>0 && before[a].s-before[a-1].e<1.0) a--;
    return {s:before[a].s, e:before[before.length-1].e};
  };
  items.forEach((x,i)=>{
    if(i===0){ x.stim=backTo(x.tone); x.from=x.stim?x.stim.s:x.tone.s-4; return; }
    const from=items[i-1].we;
    const inside=speech.filter(r=>r.s>=from-0.05&&r.e<=x.tone.s+0.05);
    x.stim = inside.length ? {s:inside[0].s, e:inside[inside.length-1].e} : null;
    x.from = from;
  });
  const known=items.filter(x=>x.we!=null).map(x=>x.we-x.ws);
  const lastWin=known.length?known[known.length-1]:2;
  const tail=items[exp-1];
  /* the source recording stops when the last window closes */
  tail.we=Math.min(dur, tail.ws+lastWin);
  const medLead=(()=>{
    const v=items.filter(x=>x.from!=null).map(x=>x.ws-x.from).sort((a,b)=>a-b);
    return v.length?v[v.length>>1]:3;
  })();
  SRCCYC=items.map((x,i)=>({
    stim: x.stim?x.stim.e-x.stim.s:0,
    lead: x.from!=null ? x.ws-x.from : medLead,
    win : Math.max(0.5,x.we-x.ws)
  }));
  SRCINFO={file:name,dur,tones:tones.length,exp};
  const w=SRCCYC.map(c=>c.win);
  setSrc("fmtSrcOk",exp,Math.min.apply(null,w),Math.max.apply(null,w));
  paintSrcTable(items);
}

      "<td>"+(x.stim?(x.stim.e-x.stim.s).toFixed(2):"—")+"</td>"+
      "<td>"+(x.tone.e-x.tone.s).toFixed(2)+(pause!=null?" <span class=\"meta\">+"+pause.toFixed(2)+"</span>":"")+"</td>"+
      "<td>"+c.win.toFixed(2)+"</td>"+

/* ---------- tone detection ----------
   The beep that marks the start of each response window is a pure tone, which is
   easy to find even when speech is present: a Goertzel filter at the tone
   frequency, compared against the total energy of the same frame, separates it
   from voice. When the beeps are audible this is a far better anchor than
   guessing from silence, and it is what makes recordings that also captured the
   stimulus playback usable. */
function findTones(f0){
  if(!BUF) return [];
  const sr=BUF.sampleRate, N=512, HOPN=Math.round(sr*0.01);
  const ch=BUF.numberOfChannels, data=[];
  for(let c=0;c<ch;c++) data.push(BUF.getChannelData(c));
  const k=Math.round(N*f0/sr), w=2*Math.PI*k/N, coeff=2*Math.cos(w);
  const frames=Math.floor((BUF.length-N)/HOPN);
  const ratio=new Float32Array(Math.max(0,frames));
  const buf=new Float32Array(N);
  for(let f=0;f<frames;f++){
    const off=f*HOPN;
    let tot=0;
    for(let i=0;i<N;i++){
      let v=0; for(let c=0;c<ch;c++) v+=data[c][off+i];
      v/=ch; buf[i]=v; tot+=v*v;
    }
    if(tot<1e-9){ ratio[f]=0; continue; }
    let s1=0,s2=0;
    for(let i=0;i<N;i++){ const s0=buf[i]+coeff*s1-s2; s2=s1; s1=s0; }
    const pw=(s1*s1+s2*s2-coeff*s1*s2)*4/(N*N);   /* power at f0 */
    ratio[f]=Math.min(1,pw/(tot/N));
  }
  const minF=Math.round(0.12/0.01);
  const out=[]; let st=-1;
  for(let f=0;f<ratio.length;f++){
    if(ratio[f]>0.45){ if(st<0) st=f; }
    else if(st>=0){ if(f-st>=minF) out.push({s:st*0.01, e:f*0.01}); st=-1; }
  }
  if(st>=0&&ratio.length-st>=minF) out.push({s:st*0.01,e:ratio.length*0.01});
  return out;
}

  const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);

    for(let i=Math.max(0,Math.floor(a));i<Math.min(ENV.length,Math.max(Math.ceil(b),Math.floor(a)+1));i++)

    if(dur<1) tr.className="short";
    const why=(s.why||[]).map(k=>T(k)).filter(Boolean).join(", ");
    const note = why || (s.off!=null ? T("fmtNoteOff")(s.off) : "");
    if(s.level==="low") tr.className="short";
    /* Both edges can be moved from the table. Dragging on the waveform is still
       there, but a table control is reachable however many segments there are. */
    const edge=(k,v,cls)=>'<td'+(cls?' class="'+cls+'"':'')+'><span class="nudge">'+
      '<button class="nb" data-i="'+i+'" data-k="'+k+'" data-d="-1" '+
        'aria-label="'+T("aNudgeBack")+'">◀</button>'+
      '<span class="v">'+v.toFixed(2)+'</span>'+
      '<button class="nb" data-i="'+i+'" data-k="'+k+'" data-d="1" '+
        'aria-label="'+T("aNudgeFwd")+'">▶</button></span></td>';
    tr.innerHTML='<td>'+itemNo(i)+'</td>'+
      '<td><span class="fileline"><button class="play" data-play="'+i+'" '+
        'aria-label="'+T("aPlaySeg")+'">▶</button>'+
      '<span class="nm">'+fileName(i)+'</span></span></td>'+
      (hasTgt?'<td class="tgtcol">'+esc(targetOf(i))+'</td>':'')+
      edge("s",s.s)+edge("e",s.e,"endc")+'<td class="lenc">'+dur.toFixed(2)+'</td>'+
      '<td><span class="chip '+(s.level||"ok")+'">'+T("lv_"+(s.level||"ok"))+'</span></td>'+
      '<td>'+note+'</td>'+
      '<td><button class="iconbtn" data-del="'+i+'">✕</button></td>';
    tr.onclick=ev=>{ if(ev.target.closest("button")) return; focusRow(i); play(s.s,s.e); };
    tb.appendChild(tr);
  });
  if(FOCUS>=SEGS.length) FOCUS=-1;
  paintFocus();
  paintConf();
  tb.querySelectorAll("[data-del]").forEach(b=>{
    b.onclick=ev=>{ ev.stopPropagation(); SEGS.splice(+b.dataset.del,1); drawMarks(); renderTable(); };
  });
  tb.querySelectorAll("[data-play]").forEach(b=>{
    b.onclick=ev=>{ ev.stopPropagation(); const i=+b.dataset.play, s=SEGS[i];
      if(s){ focusRow(i); play(s.s,s.e); } };
  });
  /* one press moves a boundary by 50 ms; holding it repeats */
  const NUDGE=0.05;
  tb.querySelectorAll(".nb").forEach(b=>{
    const step=()=>{
      const i=+b.dataset.i, k=b.dataset.k, s=SEGS[i];
      if(!s) return;
      const dt=(+b.dataset.d)*NUDGE;
      if(k==="s") s.s=Math.max(0,Math.min(s.s+dt, s.e-NUDGE));
      else        s.e=Math.min(BUF?BUF.duration:1e9, Math.max(s.e+dt, s.s+NUDGE));
      ensureVisible(k==="s"?s.s:s.e);
      drawMarks(); renderTable();
      const again=$("segBody").querySelector('.nb[data-i="'+i+'"][data-k="'+k+'"][data-d="'+b.dataset.d+'"]');
      if(again) again.focus();
    };
    b.onclick=ev=>{ ev.stopPropagation(); step(); };
    let hold=null;
    const stop=()=>{ clearTimeout(hold); hold=null; };
    b.onmousedown=ev=>{ ev.stopPropagation();
      hold=setTimeout(function rep(){ step(); hold=setTimeout(rep,90); },400); };
    b.onmouseup=stop; b.onmouseleave=stop; b.onblur=stop;
  });
}


/* ---------- confidence ----------
   Nothing here measures whether a transcription is right; it reports how much
   the boundary itself can be trusted, from signals that are actually
   observable: how the boundary was placed, whether speech runs into the edge of
   the segment, and whether the segment sits where the surrounding cadence says
   it should. The point is to tell the researcher which few items to listen to,
   not to certify the rest. */
function median(a){ if(!a.length) return 0; const b=a.slice().sort((x,y)=>x-y);
  return b[Math.floor(b.length/2)]; }
function scoreSegments(){
  if(!SEGS.length||!ENV) return;
  const fl=floorLevel(), pk=peakLevel();
  const thr=Math.max(fl*3, fl+(pk-fl)*0.06);
  const at=t=>{ const i=Math.round(t/HOP); return i>=0&&i<ENV.length&&ENV[i]>thr; };
  const durs=SEGS.map(x=>x.e-x.s), md=median(durs);
  const iv=[]; for(let i=1;i<SEGS.length;i++) iv.push(SEGS[i].s-SEGS[i-1].s);
  const mi=median(iv);
  const base=GRIDINFO ? (GRIDINFO.viaTone?1.0:0.9) : 0.85;
  SEGS.forEach((x,i)=>{
    let c=base; const why=[];
    if(x.empty){ c=Math.min(c,0.45); why.push("wEmpty"); }
    else{
      if(at(x.s+0.03)){ c-=0.35; why.push("wClipStart"); }
      if(at(x.e-0.03)){ c-=0.30; why.push("wClipEnd"); }
      if(x.e-x.s<0.8){ c-=0.30; why.push("wShort"); }
      if(md>0&&x.e-x.s>md*2.2){ c-=0.20; why.push("wLong"); }
    }
    if(mi>0&&i>0&&Math.abs((x.s-SEGS[i-1].s)-mi)>mi*0.45){ c-=0.25; why.push("wCadence"); }
    if(x.off!=null&&Math.abs(x.off)>1.5){ c-=0.25; why.push("wOffset"); }
    x.conf=Math.max(0,Math.min(1,c));
    x.why=why;
    x.level=x.conf>=0.8?"ok":(x.conf>=0.55?"mid":"low");
  });
}
function paintConf(){
  const box=$("confBox");
  if(!SEGS.length){ box.textContent=""; box.classList.add("hidden"); return; }
  box.classList.remove("hidden");
  const low=SEGS.filter(x=>x.level==="low").length;
  const mid=SEGS.filter(x=>x.level==="mid").length;
  const src=GRIDINFO ? (GRIDINFO.viaTone?T("srcTone"):T("srcGrid")) : T("srcSilence");
  box.classList.toggle("warn", low>0);
  box.textContent=T("fmtConf")(SEGS.length,SEGS.length-low-mid,mid,low,src);
}

/* ---------- playback ---------- */
function stop(){ if(SRC){ try{SRC.stop();}catch(e){} SRC=null; }
  cancelAnimationFrame(RAF); const c=marks.querySelector(".cursor"); if(c) c.remove(); }
function play(a,b){
  stop();
  const s=ac().createBufferSource(); s.buffer=BUF; s.connect(ac().destination);
  s.start(0,a,Math.max(0.02,b-a)); SRC=s;
  const cur=document.createElement("div"); cur.className="cursor"; marks.appendChild(cur);
  const t0=ac().currentTime;
  (function tick(){
    const t=a+(ac().currentTime-t0);
    cur.style.left=pxOf(Math.min(t,b))+"px";
    if(t<b) RAF=requestAnimationFrame(tick); else cur.remove();
  })();
}
$("playAll").onclick=()=>{ if(BUF) play(0,BUF.duration); };
$("stopBtn").onclick=stop;

/* ---------- WAV encoding ---------- */
/* Exported at 16 kHz mono: the rate Whisper works at, so the files stay small
   without losing anything the scoring step would have used. */
const OUT_SR=16000;
function encodeWav(mono,sr){
  const n=mono.length;
  const buf=new ArrayBuffer(44+n*2), dv=new DataView(buf);
  const str=(o,s)=>{ for(let i=0;i<s.length;i++) dv.setUint8(o+i,s.charCodeAt(i)); };
  str(0,"RIFF"); dv.setUint32(4,36+n*2,true); str(8,"WAVEfmt ");
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,sr,true); dv.setUint32(28,sr*2,true); dv.setUint16(32,2,true);
  dv.setUint16(34,16,true); str(36,"data"); dv.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){
    let v=Math.max(-1,Math.min(1,mono[i]));
    dv.setInt16(44+i*2, v<0?v*0x8000:v*0x7FFF, true);
  }
  return new Blob([buf],{type:"audio/wav"});
}
async function toWav(seg){
  const sr=BUF.sampleRate, ch=BUF.numberOfChannels;
  const a=Math.floor(seg.s*sr), b=Math.min(BUF.length,Math.ceil(seg.e*sr));
  const n=Math.max(1,b-a);
  const chans=[]; for(let c=0;c<ch;c++) chans.push(BUF.getChannelData(c));
  const mono=new Float32Array(n);
  for(let i=0;i<n;i++){ let v=0; for(let c=0;c<ch;c++) v+=chans[c][a+i]||0; mono[i]=v/ch; }
  if(sr===OUT_SR) return encodeWav(mono,OUT_SR);
  const len=Math.max(1,Math.round(n*OUT_SR/sr));
  const off=new OfflineAudioContext(1,len,OUT_SR);
  const src=off.createBufferSource();
  const tmp=off.createBuffer(1,n,sr); tmp.copyToChannel(mono,0);
  src.buffer=tmp; src.connect(off.destination); src.start();
  const out=await off.startRendering();
  return encodeWav(out.getChannelData(0),OUT_SR);
}

/* ---------- export ----------
   The ZIP is written here rather than pulled from a library, so the page needs
   no network access at all: WAV data is stored uncompressed, which is also what
   a general-purpose compressor would end up doing with it. */
const CRCT=(()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; }
  return t; })();
function crc32(u8){ let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c=CRCT[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0; }
function zipStore(files){        /* [{name, data:Uint8Array}] */
  const enc=new TextEncoder(), parts=[], central=[];
  let off=0;
  for(const f of files){
    const nm=enc.encode(f.name), crc=crc32(f.data), sz=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true);
    lh.setUint16(8,0,true); lh.setUint16(10,0,true); lh.setUint16(12,0,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,sz,true); lh.setUint32(22,sz,true);
    lh.setUint16(26,nm.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nm,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true);
    ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,sz,true); ch.setUint32(24,sz,true);
    ch.setUint16(28,nm.length,true); ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nm);
    off+=30+nm.length+sz;
  }
  let cs=0; for(const c of central) cs+=c.length;
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);
  end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,cs,true); end.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:"application/zip"});
}
$("exportBtn").onclick=async()=>{
  if(!SEGS.length) return;
  if(!$("pid").value.trim()){ $("expStatus").textContent=T("needPid"); return; }
  $("exportBtn").disabled=true; $("expStatus").textContent=T("expWorking");
  try{
    const files=[];
    for(let i=0;i<SEGS.length;i++){
      const bl=await toWav(SEGS[i]);
      files.push({name:fileName(i), data:new Uint8Array(await bl.arrayBuffer())});
      $("expBar").style.width=Math.round((i+1)/SEGS.length*100)+"%";
      await new Promise(r=>setTimeout(r,0));
    }
    const head="item,file,start_s,end_s,duration_s,confidence,level,flags\n";
    const body=SEGS.map((x,i)=>[itemNo(i),fileName(i),x.s.toFixed(3),x.e.toFixed(3),
      (x.e-x.s).toFixed(3),(x.conf!=null?x.conf.toFixed(2):""),x.level||"",
      '"'+(x.why||[]).join(";")+'"'].join(",")).join("\n");
    files.push({name:"segments.csv",
      data:new TextEncoder().encode(head+body+"\n")});
    const blob=zipStore(files);
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=(($("pid").value||"P01").trim())+"_segments.zip";
    document.body.appendChild(a); a.click(); a.remove();
    $("expStatus").textContent=T("fmtExpDone")(SEGS.length);
  }catch(e){
    $("expStatus").textContent=T("errZip");
  }
  $("exportBtn").disabled=false;
};
$("resetBtn").onclick=()=>location.reload();

/* ---------- init ---------- */
$("foot").textContent="v1.0 · 2026-08-12 · silence detection · beep alignment · fixed-schedule timing grid · no network, no upload";
applyLang(); setMode();
</script>
</body>
